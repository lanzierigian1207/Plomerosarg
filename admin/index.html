<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/Prueba_2/assets/logo-plomeros-circular.png">
  <link rel="apple-touch-icon" href="/Prueba_2/assets/logo-plomeros-circular.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Panel Admin | Inscripciones</title>
  <style>
    :root {
      --ink: #182638;
      --muted: #66758a;
      --bg: #f3f6f8;
      --card: #ffffff;
      --card-soft: #f8fafc;
      --line: #dce4ee;
      --line-strong: #c5d0dd;
      --accent: #155aa7;
      --accent-strong: #0f407d;
      --accent-soft: #eaf3ff;
      --teal: #147b74;
      --teal-soft: #e8f7f5;
      --gold: #9a6b12;
      --gold-soft: #fff5dd;
      --ok: #17824a;
      --ok-soft: #eaf8ef;
      --warn: #8a620e;
      --off: #ad352d;
      --off-soft: #fff0ef;
      --shadow: 0 18px 44px rgba(24, 38, 56, 0.09);
      --shadow-soft: 0 8px 24px rgba(24, 38, 56, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    html {
      background: var(--bg);
    }

    body {
      font-family: "Manrope", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(21, 90, 167, 0.08) 0%, rgba(21, 90, 167, 0) 280px),
        linear-gradient(90deg, rgba(20, 123, 116, 0.05) 0%, rgba(154, 107, 18, 0.05) 100%),
        var(--bg);
      min-height: 100vh;
      padding: 28px;
      letter-spacing: 0;
    }

    .wrap {
      max-width: 1360px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .top {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.96) 0%, rgba(246, 250, 252, 0.96) 58%, rgba(234, 243, 255, 0.95) 100%);
      border: 1px solid rgba(197, 208, 221, 0.9);
      border-radius: 8px;
      color: var(--ink);
      padding: 20px;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto;
      gap: 18px;
      align-items: start;
      box-shadow: var(--shadow);
    }

    .top h1 {
      font-size: clamp(1.55rem, 2.4vw, 2.2rem);
      line-height: 1.1;
      margin: 4px 0 10px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .top-copy {
      min-width: 0;
    }

    .panel-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid var(--line);
      object-fit: contain;
      padding: 5px;
      box-shadow: var(--shadow-soft);
      flex: 0 0 auto;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .summary {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-weight: 600;
      min-width: 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 999px;
      background: #ffffff;
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 700;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .pill strong {
      color: var(--accent);
      font-weight: 800;
    }

    .updated-pill {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .btn {
      min-height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #ffffff;
      color: var(--accent);
      padding: 9px 14px;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      border-color: rgba(21, 90, 167, 0.42);
      box-shadow: var(--shadow-soft);
      transform: translateY(-1px);
      outline: none;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.56;
      transform: none;
      box-shadow: none;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover,
    .btn-primary:focus-visible {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    .btn-quiet {
      color: #5b6b7f;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 760px;
      min-width: 0;
    }

    .logout-form {
      display: inline-flex;
    }

    .view-switch {
      display: inline-flex;
      gap: 6px;
      padding: 5px;
      border-radius: 8px;
      background: #edf3f9;
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 2px rgba(24, 38, 56, 0.04);
      max-width: 100%;
      min-width: 0;
    }

    .btn-view {
      min-height: 34px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: #43556d;
      padding: 7px 11px;
      font: inherit;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
    }

    .btn-view.is-active {
      background: #ffffff;
      color: var(--accent);
      border-color: var(--line);
      box-shadow: 0 6px 16px rgba(24, 38, 56, 0.08);
    }

    .btn-view:hover,
    .btn-view:focus-visible {
      background: rgba(255, 255, 255, 0.78);
      color: var(--accent-strong);
      outline: none;
    }

    .events {
      display: grid;
      gap: 16px;
    }

    .event-card {
      background: var(--card);
      border: 1px solid rgba(197, 208, 221, 0.9);
      border-left: 4px solid rgba(21, 90, 167, 0.75);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
    }

    .event-card.is-collapsed .event-head {
      border-bottom: 0;
    }

    .event-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 18px;
      background:
        linear-gradient(90deg, rgba(234, 243, 255, 0.86) 0%, rgba(248, 250, 252, 0.96) 100%);
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .event-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding-top: 2px;
    }

    .event-title {
      font-size: 1.05rem;
      line-height: 1.2;
      min-width: 0;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .event-expand {
      width: 32px;
      height: 32px;
      border: 1px solid #bed1e8;
      border-radius: 8px;
      background: #ffffff;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 0 0 auto;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .event-expand:hover,
    .event-expand:focus-visible {
      border-color: rgba(21, 90, 167, 0.48);
      box-shadow: var(--shadow-soft);
      outline: none;
    }

    .event-expand:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .event-expand-icon {
      width: 9px;
      height: 9px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg) translate(-1px, -1px);
      transition: transform 0.18s ease;
    }

    .event-expand[aria-expanded="true"] .event-expand-icon {
      transform: rotate(225deg) translate(-1px, -1px);
    }

    .counter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #f6f9fd;
      color: var(--accent);
      border: 1px solid #cbdced;
      font-size: 0.82rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .counter-attendance {
      color: var(--teal);
      border-color: #baded9;
      background: var(--teal-soft);
    }

    .event-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex: 1 1 520px;
    }

    .btn-event {
      min-height: 32px;
      border: 1px solid #bfd1e8;
      border-radius: 8px;
      background: #fff;
      color: var(--accent);
      padding: 7px 11px;
      font: inherit;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    .btn-event:hover,
    .btn-event:focus-visible {
      border-color: rgba(21, 90, 167, 0.5);
      background: #f9fbff;
      box-shadow: 0 7px 18px rgba(24, 38, 56, 0.08);
      transform: translateY(-1px);
      outline: none;
    }

    .btn-toggle {
      border-color: #e1c47f;
      color: var(--gold);
      background: var(--gold-soft);
    }

    .btn-toggle.is-on {
      border-color: #b7dec6;
      color: var(--ok);
      background: var(--ok-soft);
    }

    .btn-toggle.is-off {
      border-color: #efb8b3;
      color: var(--off);
      background: var(--off-soft);
    }

    .btn-event:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .event-state {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      min-height: 30px;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 6px 10px;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .event-state.is-on {
      color: var(--ok);
      border-color: #b8dec7;
      background: var(--ok-soft);
    }

    .event-state.is-off {
      color: var(--off);
      border-color: #f1b5af;
      background: var(--off-soft);
    }

    .empty {
      padding: 18px;
      color: var(--muted);
      font-weight: 600;
      background: var(--card-soft);
    }

    .table-wrap {
      overflow: auto;
      border-top: 1px solid var(--line);
      background: #ffffff;
    }

    .rows-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px 16px 16px;
      border-top: 1px solid var(--line);
      background: var(--card-soft);
    }

    .rows-info {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
      margin-right: 6px;
    }

    .attendance-box {
      margin: 16px 18px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card-soft);
      display: grid;
      gap: 12px;
    }

    .attendance-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--ink);
    }

    .attendance-form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .attendance-input {
      width: 210px;
      max-width: 100%;
      min-height: 38px;
      border: 1px solid #b8c8db;
      border-radius: 8px;
      padding: 9px 11px;
      font: inherit;
      font-size: 0.9rem;
      color: var(--ink);
      background: #fff;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .attendance-input:focus {
      border-color: rgba(21, 90, 167, 0.62);
      box-shadow: 0 0 0 3px rgba(21, 90, 167, 0.12);
      outline: none;
    }

    .attendance-day-select {
      width: 230px;
    }

    .attendance-hint {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 600;
    }

    .attendance-error {
      color: #8f241f;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .attendance-result {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      padding: 12px;
      display: grid;
      gap: 6px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .attendance-row {
      font-size: 0.9rem;
      color: #213750;
    }

    .attendance-check-wrap {
      margin-top: 4px;
    }

    .btn-attendance-check {
      border: 0;
      border-radius: 8px;
      background: #188645;
      color: #fff;
      padding: 8px 13px;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .btn-attendance-check:hover,
    .btn-attendance-check:focus-visible {
      background: #0f733b;
      box-shadow: 0 8px 18px rgba(23, 130, 74, 0.2);
      transform: translateY(-1px);
      outline: none;
    }

    .btn-attendance-check.is-done {
      background: #0f6f38;
    }

    .certificate-box {
      margin: 16px 18px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card-soft);
      display: grid;
      gap: 10px;
    }

    .certificate-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--ink);
    }

    .certificate-hint {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .certificate-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mail-box {
      margin: 16px 18px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card-soft);
      display: grid;
      gap: 12px;
    }

    .mail-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--ink);
    }

    .mail-hint {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .mail-recipient-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mail-recipient-list {
      max-height: 230px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
    }

    .mail-recipient-option {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: start;
      padding: 10px 12px;
      border-bottom: 1px solid #edf3fb;
      cursor: pointer;
      transition: background 0.16s ease;
    }

    .mail-recipient-option:hover {
      background: #f8fbff;
    }

    .mail-recipient-option:last-child {
      border-bottom: 0;
    }

    .mail-recipient-option input {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      accent-color: var(--accent);
    }

    .mail-recipient-name {
      display: block;
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 800;
      line-height: 1.25;
    }

    .mail-recipient-mail {
      display: block;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 600;
      line-height: 1.35;
      word-break: break-word;
    }

    .mail-grid {
      display: grid;
      gap: 10px;
    }

    .mail-field {
      display: grid;
      gap: 5px;
      color: #335173;
      font-size: 0.84rem;
      font-weight: 800;
    }

    .mail-input,
    .mail-textarea {
      width: 100%;
      border: 1px solid #b8c8db;
      border-radius: 8px;
      padding: 10px 11px;
      font: inherit;
      font-size: 0.92rem;
      color: var(--ink);
      background: #fff;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .mail-input:focus,
    .mail-textarea:focus {
      border-color: rgba(21, 90, 167, 0.62);
      box-shadow: 0 0 0 3px rgba(21, 90, 167, 0.12);
      outline: none;
    }

    .mail-textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.45;
    }

    .mail-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mail-result {
      border: 1px solid #b8dec7;
      border-radius: 8px;
      background: var(--ok-soft);
      color: var(--ok);
      padding: 10px 12px;
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .mail-result.is-error {
      border-color: #f1b5af;
      background: var(--off-soft);
      color: var(--off);
    }

    .raffle-box {
      margin: 16px 18px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card-soft);
      display: grid;
      gap: 12px;
    }

    .raffle-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--ink);
    }

    .raffle-hint {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .raffle-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .raffle-count-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #d7e4f5;
      border-radius: 8px;
      background: #ffffff;
      padding: 8px 12px;
    }

    .raffle-count-label {
      color: #335173;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .raffle-count-input {
      width: 74px;
      border: 1px solid #b8c8db;
      border-radius: 8px;
      padding: 6px 10px;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--ink);
      background: #fff;
    }

    .raffle-brand-wrap,
    .raffle-day-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #d7e4f5;
      border-radius: 8px;
      background: #ffffff;
      padding: 8px 12px;
    }

    .raffle-brand-label,
    .raffle-day-label {
      color: #335173;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .raffle-brand-select,
    .raffle-day-select {
      min-width: 170px;
      border: 1px solid #b8c8db;
      border-radius: 8px;
      padding: 6px 12px;
      font: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--ink);
      background: #fff;
    }

    .raffle-brand-group {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid #edf3fb;
    }

    .raffle-brand-group:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .raffle-brand-logo {
      width: 128px;
      height: 78px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      object-fit: contain;
      object-position: center;
      padding: 5px;
      flex: 0 0 auto;
    }

    .raffle-brand-info {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .raffle-brand-name {
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--accent);
    }

    .raffle-brand-names {
      margin: 0;
      padding-left: 16px;
      display: grid;
      gap: 4px;
    }

    .raffle-screen {
      position: fixed;
      inset: 0;
      z-index: 1200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(16, 27, 42, 0.78);
      backdrop-filter: blur(6px);
    }

    .raffle-screen.is-open {
      display: flex;
    }

    .raffle-screen-panel {
      width: min(1200px, 100%);
      min-height: min(82vh, 820px);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: linear-gradient(135deg, #123d6b 0%, #155aa7 56%, #147b74 100%);
      color: #fff;
      box-shadow: 0 28px 90px rgba(4, 17, 36, 0.4);
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    .raffle-screen-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 22px 26px 0;
    }

    .raffle-screen-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      color: #d8e8ff;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .raffle-screen-event {
      margin-top: 12px;
      font-size: clamp(1.6rem, 4vw, 3rem);
      line-height: 1.05;
      font-weight: 900;
      max-width: 760px;
    }

    .raffle-screen-close {
      border: 1px solid rgba(255, 255, 255, 0.36);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      padding: 10px 16px;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .raffle-screen-body {
      display: grid;
      grid-template-columns: minmax(360px, 500px) minmax(0, 1fr);
      gap: 26px;
      padding: 24px 26px 26px;
      align-items: stretch;
      min-height: 0;
    }

    .raffle-screen-brand {
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.1));
      border: 1px solid rgba(255, 255, 255, 0.24);
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 20px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .raffle-screen-brand-media {
      position: relative;
      width: 100%;
      height: clamp(300px, 38vh, 420px);
      min-height: 0;
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #f3f8ff 100%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      display: grid;
      place-items: center;
      padding: 24px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        0 18px 36px rgba(5, 19, 40, 0.18);
    }

    .raffle-screen-logo-expand {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(13, 99, 199, 0.24);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(5, 19, 40, 0.14);
    }

    .raffle-screen-logo-expand:hover {
      background: #ffffff;
      border-color: rgba(13, 99, 199, 0.42);
    }

    .raffle-screen-logo-expand[hidden] {
      display: none;
    }

    .fullscreen-corners {
      width: 18px;
      height: 18px;
      display: block;
      background:
        linear-gradient(#0d63c7, #0d63c7) left top / 8px 2px no-repeat,
        linear-gradient(#0d63c7, #0d63c7) left top / 2px 8px no-repeat,
        linear-gradient(#0d63c7, #0d63c7) right top / 8px 2px no-repeat,
        linear-gradient(#0d63c7, #0d63c7) right top / 2px 8px no-repeat,
        linear-gradient(#0d63c7, #0d63c7) left bottom / 8px 2px no-repeat,
        linear-gradient(#0d63c7, #0d63c7) left bottom / 2px 8px no-repeat,
        linear-gradient(#0d63c7, #0d63c7) right bottom / 8px 2px no-repeat,
        linear-gradient(#0d63c7, #0d63c7) right bottom / 2px 8px no-repeat;
    }

    .raffle-screen-brand-logo {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center;
      filter: drop-shadow(0 16px 24px rgba(4, 17, 36, 0.18));
      cursor: zoom-in;
    }

    .raffle-screen-brand-name {
      font-size: clamp(1.5rem, 2.6vw, 2.35rem);
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-shadow: 0 2px 10px rgba(5, 17, 36, 0.2);
    }

    .raffle-screen-brand-copy {
      color: #d6e6ff;
      font-size: 1.06rem;
      line-height: 1.45;
      font-weight: 700;
      max-width: 300px;
    }

    .brand-logo-viewer {
      position: fixed;
      inset: 0;
      z-index: 1300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: clamp(20px, 5vw, 62px);
      background: rgba(3, 13, 28, 0.92);
      backdrop-filter: blur(8px);
    }

    .brand-logo-viewer.is-open {
      display: flex;
    }

    .brand-logo-viewer-close {
      position: fixed;
      top: 18px;
      left: 18px;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.36);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font: inherit;
      font-size: 1.15rem;
      font-weight: 900;
      cursor: pointer;
    }

    .brand-logo-viewer-image-wrap {
      width: fit-content;
      max-width: min(92vw, 1120px);
      max-height: 82vh;
      border-radius: 8px;
      background: #ffffff;
      display: grid;
      place-items: center;
      padding: clamp(22px, 6vw, 70px);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
    }

    .brand-logo-viewer-image {
      display: block;
      width: min(82vw, 980px);
      height: min(72vh, 720px);
      max-width: 100%;
      max-height: 72vh;
      object-fit: contain;
      object-position: center;
    }

    .brand-logo-viewer-image.is-vector {
      width: min(82vw, 1040px);
      max-width: min(82vw, 1040px);
      max-height: 72vh;
    }

    .raffle-screen-winners {
      --raffle-screen-item-gap: 14px;
      --raffle-screen-item-height: 76px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 28px 28px 22px;
      display: grid;
      align-content: start;
      gap: 18px;
      min-height: 0;
    }

    .raffle-screen-title {
      font-size: clamp(1.4rem, 2.8vw, 2.4rem);
      line-height: 1.05;
      font-weight: 900;
    }

    .raffle-screen-subtitle {
      color: #d6e6ff;
      font-size: 1rem;
      font-weight: 600;
    }

    .raffle-screen-list {
      display: grid;
      gap: var(--raffle-screen-item-gap);
      align-content: start;
      max-height: calc((var(--raffle-screen-item-height) * 6) + (var(--raffle-screen-item-gap) * 5));
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 8px;
      scrollbar-gutter: stable;
    }

    .raffle-screen-item {
      display: grid;
      gap: 4px;
      min-height: var(--raffle-screen-item-height);
      padding: 12px 18px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .raffle-screen-item-name {
      font-size: clamp(1.2rem, 2.6vw, 2rem);
      line-height: 1.06;
      font-weight: 900;
    }

    .raffle-screen-item-dni {
      color: #d6e6ff;
      font-size: clamp(1rem, 1.8vw, 1.26rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .raffle-winner {
      border: 1px solid #cfe0f4;
      border-radius: 8px;
      background: #ffffff;
      padding: 10px;
      display: grid;
      gap: 4px;
    }

    .raffle-winner h4,
    .raffle-list h4 {
      font-size: 0.88rem;
      color: var(--accent);
      margin-bottom: 2px;
    }

    .raffle-row {
      font-size: 0.82rem;
      line-height: 1.2;
      color: #213750;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .raffle-row-name {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .raffle-remove-btn {
      border: 1px solid #f3b4b4;
      border-radius: 6px;
      background: #fff4f4;
      color: #9f1d1d;
      cursor: pointer;
      flex: 0 0 auto;
      font: inherit;
      font-size: 0.74rem;
      font-weight: 800;
      padding: 4px 7px;
    }

    .raffle-remove-btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .raffle-list {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      padding: 10px;
      display: grid;
      gap: 6px;
    }

    .raffle-list ul {
      max-height: 220px;
      overflow-y: auto;
      padding-left: 16px;
      margin: 0;
      display: grid;
      gap: 4px;
    }

    .raffle-list li {
      color: #213750;
      font-size: 0.82rem;
      line-height: 1.15;
    }

    .event-create-panel {
      background: var(--card);
      border: 1px solid rgba(197, 208, 221, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    .event-create-head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(234, 243, 255, 0.9) 0%, rgba(248, 250, 252, 0.98) 100%);
      display: grid;
      gap: 6px;
    }

    .event-create-title {
      font-size: 1.14rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .event-create-hint {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.45;
    }

    .event-create-form {
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .event-create-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .event-create-field {
      display: grid;
      gap: 6px;
      color: #335173;
      font-size: 0.84rem;
      font-weight: 800;
    }

    .event-create-field.is-wide {
      grid-column: 1 / -1;
    }

    .event-create-field input,
    .event-create-field textarea {
      width: 100%;
      min-height: 40px;
      border: 1px solid #b8c8db;
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 10px 11px;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .event-create-field textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.45;
    }

    .event-create-field input:focus,
    .event-create-field textarea:focus {
      border-color: rgba(21, 90, 167, 0.62);
      box-shadow: 0 0 0 3px rgba(21, 90, 167, 0.12);
      outline: none;
    }

    .event-create-switches {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .event-create-check {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card-soft);
      color: var(--ink);
      padding: 10px;
      font-size: 0.84rem;
      font-weight: 800;
      line-height: 1.35;
    }

    .event-create-check input {
      width: 18px;
      height: 18px;
      margin-top: 1px;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    .event-create-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .event-create-result {
      border: 1px solid #b8dec7;
      border-radius: 8px;
      background: var(--ok-soft);
      color: var(--ok);
      padding: 11px 12px;
      display: grid;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .event-create-result.is-error {
      border-color: #f1b5af;
      background: var(--off-soft);
      color: var(--off);
    }

    .event-create-result a {
      color: var(--accent);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .event-create-sql {
      max-height: 220px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: #213750;
      padding: 10px;
      font-size: 0.78rem;
      white-space: pre-wrap;
    }

    .event-catalog {
      border-top: 1px solid var(--line);
      background: var(--card-soft);
      padding: 16px 18px 18px;
      display: grid;
      gap: 10px;
    }

    .event-catalog-title {
      color: var(--ink);
      font-size: 0.95rem;
      font-weight: 800;
    }

    .event-catalog-list {
      display: grid;
      gap: 8px;
    }

    .event-catalog-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      padding: 10px 12px;
    }

    .event-catalog-name {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .event-catalog-meta {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      margin-top: 2px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
    }

    th,
    td {
      text-align: left;
      padding: 11px 12px;
      border-bottom: 1px solid #edf2f8;
      vertical-align: top;
      font-size: 0.9rem;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #51637a;
      background: #f3f7fb;
      box-shadow: inset 0 -1px 0 var(--line);
    }

    td {
      color: #213750;
    }

    tbody tr:nth-child(even) td {
      background: #fbfdff;
    }

    tbody tr:hover td {
      background: #f3f8ff;
    }

    .attendance-col {
      text-align: center;
      width: 88px;
      white-space: nowrap;
    }

    .reconfirm-col {
      text-align: center;
      width: 128px;
      white-space: nowrap;
    }

    .attendance-checkbox {
      width: 18px;
      height: 18px;
      accent-color: #188645;
      cursor: pointer;
      vertical-align: middle;
    }

    .status {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(197, 208, 221, 0.9);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--muted);
      font-weight: 600;
      box-shadow: 0 8px 22px rgba(24, 38, 56, 0.05);
    }

    .status.error {
      border-color: #f1b5af;
      background: var(--off-soft);
      color: #8f241f;
    }

    .status.warning {
      border-color: #ebd7ac;
      background: var(--gold-soft);
      color: var(--warn);
    }

    @media (max-width: 1040px) {
      .top {
        grid-template-columns: 1fr;
      }

      .top-actions {
        justify-content: flex-start;
        max-width: none;
        width: 100%;
      }

      .view-switch {
        width: 100%;
        overflow-x: auto;
        justify-content: flex-start;
        scrollbar-width: thin;
      }

      .btn-view {
        flex: 0 0 auto;
      }

      .event-head {
        display: grid;
        grid-template-columns: 1fr;
      }

      .event-meta {
        justify-content: flex-start;
        flex-basis: auto;
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 14px;
        overflow-x: hidden;
      }

      .wrap {
        gap: 14px;
        width: 100%;
        max-width: 100%;
        overflow: hidden;
      }

      .top {
        padding: 16px;
        max-width: calc(100vw - 28px);
      }

      .top * {
        min-width: 0;
      }

      .panel-brand {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: flex-start;
      }

      .brand-mark {
        width: 46px;
        height: 46px;
      }

      .top h1 {
        font-size: 1.45rem;
      }

      .summary {
        gap: 7px;
      }

      .top-actions,
      .attendance-form,
      .mail-recipient-tools,
      .mail-actions,
      .raffle-actions,
      .certificate-actions {
        align-items: stretch;
      }

      .top-actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
      }

      .top-actions .btn,
      .logout-form,
      .logout-form .btn,
      .attendance-input,
      .attendance-day-select,
      .attendance-form .btn-event,
      .mail-actions .btn-event,
      .raffle-actions .btn-event,
      .event-create-actions .btn-event {
        width: 100%;
      }

      .event-head {
        padding: 14px;
      }

      .attendance-box,
      .certificate-box,
      .mail-box,
      .raffle-box {
        margin: 14px;
        padding: 14px;
      }

      .raffle-brand-wrap,
      .raffle-day-wrap,
      .raffle-count-wrap {
        width: 100%;
        justify-content: space-between;
      }

      .raffle-brand-select,
      .raffle-day-select {
        min-width: 0;
        flex: 1 1 auto;
        max-width: 62%;
      }

      .pill {
        font-size: 0.88rem;
      }

      .event-create-grid,
      .event-create-switches,
      .event-catalog-row {
        grid-template-columns: 1fr;
      }

      .raffle-screen {
        padding: 14px;
      }

      .raffle-screen-panel {
        min-height: 0;
      }

      .raffle-screen-head {
        padding: 18px 18px 0;
      }

      .raffle-screen-body {
        grid-template-columns: 1fr;
        padding: 18px;
      }

      .raffle-screen-brand {
        padding: 20px 18px;
      }

      .raffle-screen-brand-media {
        height: clamp(220px, 46vh, 320px);
        padding: 18px;
      }

      .raffle-screen-winners {
        padding: 20px 18px;
      }
    }

    @media (max-width: 520px) {
      .panel-brand {
        grid-template-columns: minmax(0, 1fr);
      }

      .brand-mark {
        width: 42px;
        height: 42px;
      }

      .top h1 {
        font-size: 1.32rem;
      }

      .pill {
        min-height: 30px;
        padding: 5px 9px;
        font-size: 0.82rem;
      }

      .updated-pill {
        flex: 1 0 100%;
        font-size: 0.84rem;
      }

      .btn-view {
        padding: 6px 9px;
        font-size: 0.78rem;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="panel-brand">
        <img class="brand-mark" src="../Prueba_2/assets/logo-plomeros-circular.png" alt="">
        <div class="top-copy">
          <div class="eyebrow">Administracion</div>
          <h1>Panel de inscripciones</h1>
          <div class="summary">
            <span class="pill">Total: <strong id="totalValue">0</strong></span>
            <span class="pill">Asistencias: <strong id="attendanceTotalValue">0</strong></span>
            <span class="pill">Almuerzos: <strong id="lunchTotalValue">0</strong></span>
            <span class="pill">Reconfirmados: <strong id="reconfirmTotalValue">0</strong></span>
            <span class="updated-pill" id="updatedAt">Sin actualización</span>
          </div>
        </div>
      </div>
      <div class="top-actions">
        <div class="view-switch" role="tablist" aria-label="Vista del panel">
          <button class="btn-view is-active" id="viewInscripcionesBtn" type="button">Inscripciones</button>
          <button class="btn-view" id="viewAsistenciaBtn" type="button">Asistencia Encuentros</button>
          <button class="btn-view" id="viewLunchBtn" type="button">Almuerzo</button>
          <button class="btn-view" id="viewSorteosBtn" type="button">Sorteos</button>
          <button class="btn-view" id="viewCertificadosBtn" type="button">Certificado asistencias</button>
          <button class="btn-view" id="viewCrearEventoBtn" type="button">Crear evento</button>
        </div>
        <button class="btn btn-primary" id="refreshBtn" type="button">Actualizar</button>
        <form class="logout-form" method="post" action="/api/admin">
          <input type="hidden" name="action" value="logout">
          <button class="btn btn-quiet" type="submit">Cerrar sesión</button>
        </form>
      </div>
    </header>

    <div class="status" id="status">Cargando datos...</div>
    <section class="events" id="eventsContainer"></section>
  </main>

  <section class="raffle-screen" id="raffleScreen" aria-hidden="true">
    <div class="raffle-screen-panel" role="dialog" aria-modal="true" aria-labelledby="raffleScreenEvent">
      <div class="raffle-screen-head">
        <div>
          <div class="raffle-screen-kicker">Resultado del sorteo</div>
          <h2 class="raffle-screen-event" id="raffleScreenEvent">Ganadores</h2>
        </div>
        <button class="raffle-screen-close" id="raffleScreenClose" type="button">Cerrar</button>
      </div>
      <div class="raffle-screen-body">
        <aside class="raffle-screen-brand">
          <div class="raffle-screen-brand-media">
            <button
              class="raffle-screen-logo-expand"
              id="raffleScreenLogoExpand"
              type="button"
              aria-label="Ver logo en pantalla completa"
              title="Ver logo en pantalla completa"
              hidden
            >
              <span class="fullscreen-corners" aria-hidden="true"></span>
            </button>
            <img class="raffle-screen-brand-logo" id="raffleScreenBrandLogo" alt="">
          </div>
          <div class="raffle-screen-brand-name" id="raffleScreenBrandName">Marca</div>
          <p class="raffle-screen-brand-copy">Premio asignado a esta marca.</p>
        </aside>
        <section class="raffle-screen-winners">
          <h3 class="raffle-screen-title">Ganadores</h3>
          <p class="raffle-screen-subtitle" id="raffleScreenSubtitle">Personas sorteadas</p>
          <div class="raffle-screen-list" id="raffleScreenList"></div>
        </section>
      </div>
    </div>
  </section>

    const raffleScreenList = document.getElementById("raffleScreenList");

    const DEFAULT_VISIBLE_ROWS = 25;
    const ADMIN_LOGIN_URL = "/api/admin";
    const PANEL_VIEW_INSCRIPCIONES = "inscripciones";

    const PANEL_VIEW_SORTEOS = "sorteos";
    const PANEL_VIEW_CERTIFICADOS = "certificados";
    const PANEL_VIEW_CREAR_EVENTO = "crear_evento";
    let currentPanelView = PANEL_VIEW_INSCRIPCIONES;
    let currentAdminRole = "admin";
    let currentEventos = [];
    const toggleInFlight = new Set();
    const certificateToggleInFlight = new Set();
    const raffleInFlight = new Set();
    const mailInFlight = new Set();
    const expandedEventsByEvent = new Map();

    const attendanceLookupByEvent = new Map();

    const SAN_LUIS_EVENT_NAME = "San Luis 8/8";
    const SAN_LUIS_DAYS = [
      { key: "viernes_7_8", label: "Viernes 7/8" },
      { key: "sabado_8_8", label: "Sabado 8/8" }

    const RAFFLE_BRANDS = [
      { key: "rheem", name: "Rheem", logo: "/Prueba_2/assets/empresas/36_rheem.png" },
      { key: "piazza", name: "Piazza", logo: "/Prueba_2/assets/empresas/12_piazza.png" },

      { key: "vasser", name: "Vasser", logo: "/Prueba_2/assets/empresas/logo-vasser.svg" },
      { key: "msb", name: "MSB", logo: "/Prueba_2/assets/empresas/39_msb_industria_argentina.png" },
      { key: "saladillo", name: "Saladillo", logo: "/Prueba_2/assets/empresas/logo-saladillo-sorteos.svg" },

      { key: "redeco_termofusion", name: "Redeco", logo: "/Prueba_2/assets/empresas/38_redeco_termofusion.png", logoLarge: "/Prueba_2/assets/empresas/logo-redeco.png" },
      { key: "duke", name: "Duke", logo: "/Prueba_2/assets/empresas/21_duke.png", logoLarge: "/Prueba_2/assets/empresas/logo-duke.png" },
      { key: "egeo", name: "Egeo", logo: "/Prueba_2/assets/empresas/32_egeo.png", logoLarge: "/Prueba_2/assets/empresas/logo-egeo.png" },
      { key: "fusio_gas", name: "Fusiogas", logo: "/Prueba_2/assets/empresas/20_fusio_gas.png" },
      { key: "latyn", name: "Latyn", logo: "/Prueba_2/assets/empresas/07_grupo_latyn.png" },
      { key: "politivo", name: "Politivo", logo: "" },
      { key: "chicote", name: "Chicote", logo: "/Prueba_2/assets/empresas/08_chicote.png" },
      { key: "krewen", name: "Krewen", logo: "/Prueba_2/assets/empresas/image_2026-05-09_113057454.png" },
      { key: "waterplast", name: "Waterplast", logo: "/Prueba_2/assets/empresas/logo-waterplast-sorteos.svg" },
      { key: "rao", name: "RAO", logo: "/Prueba_2/assets/empresas/26_rao.png", logoLarge: "/Prueba_2/assets/empresas/logo-rao.jpg" },
      { key: "dinatecnica", name: "Dinatecnica", logo: "/Prueba_2/assets/empresas/27_dinatecnica.png", logoLarge: "/Prueba_2/assets/empresas/logo-dinatecnica.png" },
      { key: "btm_bombas", name: "BTM", logo: "/Prueba_2/assets/empresas/05_btm_bombas.png" }
    ];
    const RAFFLE_BRAND_BY_KEY = new Map(
      RAFFLE_BRANDS.map((brand) => [brand.key, brand])
    );

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeBrandKey(value) {
      return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "");
    }

    function normalizeEventKey(value) {
      return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
    }

    function isSanLuisEvent(itemOrName) {
      const eventName = typeof itemOrName === "string"
        ? itemOrName
        : itemOrName?.evento;
      return normalizeEventKey(eventName) === normalizeEventKey(SAN_LUIS_EVENT_NAME);
    }

    function normalizeAttendanceDayKey(value) {
      const normalized = String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9/.-]+/g, "_")
        .replace(/^_+|_+$/g, "");

      if (!normalized) return "";
      if (
        normalized === "viernes_7_8" ||
        normalized === "viernes" ||
        normalized === "2026-08-07" ||
        normalized.includes("viernes") ||
        normalized.includes("7/8")
      ) {
        return "viernes_7_8";
      }
      if (
        normalized === "sabado_8_8" ||
        normalized === "sabado" ||
        normalized === "2026-08-08" ||
        normalized.includes("sabado") ||
        normalized.includes("8/8")
      ) {
        return "sabado_8_8";
      }
      return "";
    }

    function getDayLabel(dayKey) {
      const normalizedDayKey = normalizeAttendanceDayKey(dayKey);
      const day = SAN_LUIS_DAYS.find((item) => item.key === normalizedDayKey);
      return day?.label || "";
    }

    function getRowAttendanceForDay(row, dayKey) {
      const normalizedDayKey = normalizeAttendanceDayKey(dayKey);
      if (!normalizedDayKey) {
        return row?.asistio === true;
      }
      return row?.asistencia_dias?.[normalizedDayKey] === true;
    }

    function getRowRaffleStateForDay(row, dayKey) {
      const normalizedDayKey = normalizeAttendanceDayKey(dayKey);
      if (!normalizedDayKey) {
        return {
          sorteado: row?.sorteado === true,
          marca_sorteo: row?.marca_sorteo || ""
        };
      }
      const dayState = row?.sorteo_dias?.[normalizedDayKey] || {};
      return {
        sorteado: dayState?.sorteado === true,
        marca_sorteo: dayState?.marca_sorteo || ""
      };
    }

    function hasAnyDayAttendance(row) {
      if (row?.asistio === true) return true;
      return Object.values(row?.asistencia_dias || {}).some(Boolean);
    }

    function getBrandInfo(value) {
      const key = normalizeBrandKey(value);
      return RAFFLE_BRAND_BY_KEY.get(key) || null;
    }

    function getBrandLabel(value) {
      const brand = getBrandInfo(value);
      return brand?.name || "Sin marca";
    }

    function getBrandLogo(value) {
      const brand = getBrandInfo(value);
      return brand?.logo || "";
    }

    function getBrandLogoLarge(value) {
      const brand = getBrandInfo(value);
      return brand?.logoLarge || brand?.logo || "";
    }

    function isVectorLogo(src) {
      return /\.svg(?:[?#].*)?$/i.test(String(src || ""));
    }

    function closeRaffleScreen() {
      if (brandLogoViewer.classList.contains("is-open")) {
        closeBrandLogoViewer();
      }
      raffleScreen.classList.remove("is-open");
      raffleScreen.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function closeBrandLogoViewer() {
      brandLogoViewer.classList.remove("is-open");
      brandLogoViewer.setAttribute("aria-hidden", "true");
      brandLogoViewerImage.removeAttribute("src");
      brandLogoViewerImage.alt = "";
      brandLogoViewerImage.classList.remove("is-vector");
      brandLogoViewerImage.style.removeProperty("--brand-logo-max-width");
      brandLogoViewerImage.style.removeProperty("--brand-logo-max-height");
      if (!raffleScreen.classList.contains("is-open")) {
        document.body.style.overflow = "";
      }
    }

    function openBrandLogoViewer() {
      const logoSrc =
        raffleScreenBrandLogo.dataset.largeLogo ||
        raffleScreenBrandLogo.getAttribute("src");
      const logoAlt = raffleScreenBrandLogo.getAttribute("alt") || "Logo de la marca";
      if (!logoSrc || raffleScreenBrandLogo.style.display === "none") {
        return;
      }

      brandLogoViewerImage.onload = () => {
        const vector = isVectorLogo(logoSrc);
        brandLogoViewerImage.classList.toggle("is-vector", vector);
        if (!vector && brandLogoViewerImage.naturalWidth && brandLogoViewerImage.naturalHeight) {
          brandLogoViewerImage.style.setProperty(
            "--brand-logo-max-width",
            `${brandLogoViewerImage.naturalWidth}px`
          );
          brandLogoViewerImage.style.setProperty(
            "--brand-logo-max-height",
            `${brandLogoViewerImage.naturalHeight}px`
          );
        }
      };
      brandLogoViewerImage.onerror = () => {
        closeBrandLogoViewer();
      };
      brandLogoViewerImage.src = logoSrc;
      brandLogoViewerImage.alt = logoAlt;
      brandLogoViewer.classList.add("is-open");
      brandLogoViewer.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function openRaffleScreen({ eventName, brandKey, winners }) {
      const brandLabel = getBrandLabel(brandKey);
      const brandLogo = getBrandLogo(brandKey);
      const brandLogoLarge = getBrandLogoLarge(brandKey);
      const safeWinners = Array.isArray(winners) ? winners : [];

      raffleScreenEvent.textContent = eventName || "Ganadores";
      raffleScreenBrandName.textContent = brandLabel;
      raffleScreenSubtitle.textContent =
        safeWinners.length === 1
          ? "Persona ganadora del sorteo"
          : `${safeWinners.length} personas ganadoras del sorteo`;

      if (brandLogo) {
        raffleScreenBrandLogo.onload = () => {
          raffleScreenBrandLogo.style.display = "";
          raffleScreenLogoExpand.hidden = false;
        };
        raffleScreenBrandLogo.onerror = () => {
          raffleScreenBrandLogo.style.display = "none";
          raffleScreenLogoExpand.hidden = true;
        };
        raffleScreenBrandLogo.src = brandLogo;
        raffleScreenBrandLogo.alt = `Logo ${brandLabel}`;
        raffleScreenBrandLogo.dataset.largeLogo = brandLogoLarge || brandLogo;
      } else {
        raffleScreenBrandLogo.onload = null;
        raffleScreenBrandLogo.onerror = null;
        raffleScreenBrandLogo.removeAttribute("src");
        raffleScreenBrandLogo.alt = "";
        raffleScreenBrandLogo.style.display = "none";
        raffleScreenLogoExpand.hidden = true;
        delete raffleScreenBrandLogo.dataset.largeLogo;
      }

      raffleScreenList.innerHTML = safeWinners
        .map((winner) => `
          <article class="raffle-screen-item">
            <div class="raffle-screen-item-name">${escapeHtml(winner?.nombre_apellido || "-")}</div>
            <div class="raffle-screen-item-dni">DNI ${escapeHtml(winner?.dni || "-")}</div>
          </article>
        `)
        .join("");

      raffleScreen.classList.add("is-open");
      raffleScreen.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function formatDate(value) {
      if (!value) return "-";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "-";
      return new Intl.DateTimeFormat("es-AR", {
        dateStyle: "short",
        timeStyle: "short"
      }).format(date);
    }

    function setStatusMessage(message, mode = "ok") {
      statusBox.classList.remove("error", "warning");
      if (mode === "error") {
        statusBox.classList.add("error");
      } else if (mode === "warning") {
        statusBox.classList.add("warning");
      }
      statusBox.textContent = message;
    }

    function countAttendance(eventos) {
      if (!Array.isArray(eventos)) return 0;
      return eventos.reduce((total, eventItem) => {
        const rows = Array.isArray(eventItem?.inscripciones) ? eventItem.inscripciones : [];
        const eventAttendance = rows.reduce(
          (sum, row) => sum + (hasAnyDayAttendance(row) ? 1 : 0),
          0
        );
        return total + eventAttendance;
      }, 0);
    }

    function countLunch(eventos) {
      if (!Array.isArray(eventos)) return 0;
      return eventos.reduce((total, eventItem) => {
        const rows = Array.isArray(eventItem?.inscripciones) ? eventItem.inscripciones : [];
        const eventLunch = rows.reduce(
          (sum, row) => sum + (row?.almuerzo === true ? 1 : 0),
          0
        );
        return total + eventLunch;
      }, 0);
    }

    function countReconfirm(eventos) {
      if (!Array.isArray(eventos)) return 0;
      return eventos.reduce((total, eventItem) => {
        const rows = Array.isArray(eventItem?.inscripciones) ? eventItem.inscripciones : [];
        const eventReconfirm = rows.reduce(
          (sum, row) => sum + (row?.reconfirmado === true ? 1 : 0),
          0
        );
        return total + eventReconfirm;
      }, 0);
    }

    function renderViewButtons() {
      const asistenciaOnly = currentAdminRole === "asistencia";
      viewInscripcionesBtn.style.display = asistenciaOnly ? "none" : "inline-flex";
      viewLunchBtn.style.display = "inline-flex";
      viewSorteosBtn.style.display = asistenciaOnly ? "none" : "inline-flex";
      viewCertificadosBtn.style.display = asistenciaOnly ? "none" : "inline-flex";
      viewCrearEventoBtn.style.display = asistenciaOnly ? "none" : "inline-flex";
      if (
        asistenciaOnly &&
        currentPanelView !== PANEL_VIEW_ASISTENCIA &&
        currentPanelView !== PANEL_VIEW_ALMUERZO
      ) {
        currentPanelView = PANEL_VIEW_ASISTENCIA;
      }
      viewInscripcionesBtn.classList.toggle("is-active", currentPanelView === PANEL_VIEW_INSCRIPCIONES);
      viewAsistenciaBtn.classList.toggle("is-active", currentPanelView === PANEL_VIEW_ASISTENCIA);
      viewLunchBtn.classList.toggle("is-active", currentPanelView === PANEL_VIEW_ALMUERZO);
      viewSorteosBtn.classList.toggle("is-active", currentPanelView === PANEL_VIEW_SORTEOS);
      viewCertificadosBtn.classList.toggle("is-active", currentPanelView === PANEL_VIEW_CERTIFICADOS);
      viewCrearEventoBtn.classList.toggle("is-active", currentPanelView === PANEL_VIEW_CREAR_EVENTO);
      viewInscripcionesBtn.setAttribute(
        "aria-pressed",
        currentPanelView === PANEL_VIEW_INSCRIPCIONES ? "true" : "false"
      );
      viewAsistenciaBtn.setAttribute(
        "aria-pressed",
        currentPanelView === PANEL_VIEW_ASISTENCIA ? "true" : "false"
      );
      viewLunchBtn.setAttribute(
        "aria-pressed",
        currentPanelView === PANEL_VIEW_ALMUERZO ? "true" : "false"
      );
      viewSorteosBtn.setAttribute(
        "aria-pressed",
        currentPanelView === PANEL_VIEW_SORTEOS ? "true" : "false"
      );
      viewCertificadosBtn.setAttribute(
        "aria-pressed",
        currentPanelView === PANEL_VIEW_CERTIFICADOS ? "true" : "false"
      );
      viewCrearEventoBtn.setAttribute(
        "aria-pressed",
        currentPanelView === PANEL_VIEW_CREAR_EVENTO ? "true" : "false"
      );
    }

    function setPanelView(nextView) {
      if (
        currentAdminRole === "asistencia" &&
        nextView !== PANEL_VIEW_ASISTENCIA &&
        nextView !== PANEL_VIEW_ALMUERZO
      ) {
        nextView = PANEL_VIEW_ASISTENCIA;
      }
      if (
        nextView !== PANEL_VIEW_INSCRIPCIONES &&
        nextView !== PANEL_VIEW_ASISTENCIA &&
        nextView !== PANEL_VIEW_ALMUERZO &&
        nextView !== PANEL_VIEW_SORTEOS &&
        nextView !== PANEL_VIEW_CERTIFICADOS &&
        nextView !== PANEL_VIEW_CREAR_EVENTO
      ) {
        return;
      }
      if (currentPanelView === nextView) return;
      currentPanelView = nextView;
      renderViewButtons();
      renderEvents(currentEventos);
    }

    function isEventActive(item) {
      return item?.activo !== false;
    }

    function isCertificateVisible(item) {
      return item?.certificado_activo !== false;
    }

    function getEventKey(item, index) {
      return `${String(item?.evento || "evento").toLowerCase()}::${index}`;
    }

    function getScopedEventKey(item, index, dayKey = "") {
      const normalizedDayKey = normalizeAttendanceDayKey(dayKey);
      const baseKey = getEventKey(item, index);
      return normalizedDayKey ? `${baseKey}::${normalizedDayKey}` : baseKey;
    }

    function getSelectedAttendanceDay(item, index) {
      if (!isSanLuisEvent(item)) return "";
      const key = getEventKey(item, index);
      return normalizeAttendanceDayKey(attendanceDayByEvent.get(key));
    }

    function setSelectedAttendanceDay(item, index, dayKey) {
      const key = getEventKey(item, index);
      const normalizedDayKey = normalizeAttendanceDayKey(dayKey);
      if (!normalizedDayKey) {
        attendanceDayByEvent.delete(key);
        return "";
      }
      attendanceDayByEvent.set(key, normalizedDayKey);
      return normalizedDayKey;
    }

    function getSelectedRaffleDay(item, index) {
      if (!isSanLuisEvent(item)) return "";
      const key = getEventKey(item, index);
      return normalizeAttendanceDayKey(raffleDayByEvent.get(key));
    }

    function setSelectedRaffleDay(item, index, dayKey) {
      const key = getEventKey(item, index);
      const normalizedDayKey = normalizeAttendanceDayKey(dayKey);
      if (!normalizedDayKey) {
        raffleDayByEvent.delete(key);
        return "";
      }
      raffleDayByEvent.set(key, normalizedDayKey);
      return normalizedDayKey;
    }

    function buildDayOptionsHtml(selectedDay) {
      const selectedDayKey = normalizeAttendanceDayKey(selectedDay);
      return [
        `<option value="">Elegir dia</option>`,
        ...SAN_LUIS_DAYS.map((day) => `
          <option value="${escapeHtml(day.key)}" ${day.key === selectedDayKey ? "selected" : ""}>
            ${escapeHtml(day.label)}
          </option>
        `)
      ].join("");
    }

    function isEventExpanded(item, index) {
      const key = getEventKey(item, index);
      return expandedEventsByEvent.get(key) === true;
    }

    function setEventExpanded(item, index, nextValue) {
      const key = getEventKey(item, index);
      expandedEventsByEvent.set(key, nextValue === true);
    }

    function getVisibleRows(item, index, totalRows) {
      const key = getEventKey(item, index);
      const savedValue = Number.parseInt(String(visibleRowsByEvent.get(key) ?? ""), 10);
      const baseValue = Number.isFinite(savedValue) ? savedValue : DEFAULT_VISIBLE_ROWS;
      const nextValue = Math.max(0, Math.min(baseValue, totalRows));
      visibleRowsByEvent.set(key, nextValue);
      return nextValue;
    }

    function setVisibleRows(item, index, nextValue) {
      const key = getEventKey(item, index);
      const totalRows = Array.isArray(item?.inscripciones) ? item.inscripciones.length : 0;
      const clamped = Math.max(0, Math.min(Number(nextValue) || 0, totalRows));
      visibleRowsByEvent.set(key, clamped);
    }

    function normalizeMailValue(value) {
      return String(value ?? "").trim().toLowerCase();
    }

    function isValidMail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(normalizeMailValue(value));
    }

    function countUniqueMailRecipients(rows) {
      const seen = new Set();
      for (const row of Array.isArray(rows) ? rows : []) {
        const mail = normalizeMailValue(row?.mail);
        if (!mail || !isValidMail(mail) || seen.has(mail)) continue;
        seen.add(mail);
      }
      return seen.size;
    }

    function getUniqueMailRecipientRows(rows) {
      const seen = new Set();
      const recipients = [];
      for (const row of Array.isArray(rows) ? rows : []) {
        const mail = normalizeMailValue(row?.mail);
        if (!mail || !isValidMail(mail) || seen.has(mail)) continue;
        seen.add(mail);
        recipients.push({
          mail,
          nombre: String(row?.nombre_apellido || "").trim(),
          dni: normalizeDniValue(row?.dni),
          id_evento: row?.id_evento ?? ""
        });
      }
      return recipients;
    }

    function getDefaultMailSubject(item) {
      return `Informacion importante - ${item?.evento || "Plomeros ARG"}`;
    }

    function getMailComposerState(item, index) {
      const key = getEventKey(item, index);
      if (!mailComposerByEvent.has(key)) {
        mailComposerByEvent.set(key, {
          open: false,
          subject: getDefaultMailSubject(item),
          message: "",
          selectedMails: null,
          result: null
        });
      }
      return mailComposerByEvent.get(key);
    }

    function syncMailSelectionState(item, index) {
      const state = getMailComposerState(item, index);
      const recipients = getUniqueMailRecipientRows(item?.inscripciones);
      const validMails = new Set(recipients.map((recipient) => recipient.mail));

      if (!Array.isArray(state.selectedMails)) {
        state.selectedMails = recipients.map((recipient) => recipient.mail);
        return state.selectedMails;
      }

      state.selectedMails = state.selectedMails.filter((mail) => validMails.has(mail));
      return state.selectedMails;
    }

    function getSelectedMailSet(item, index) {
      return new Set(syncMailSelectionState(item, index));
    }

    function setAllMailRecipients(item, index, checked) {
      const state = getMailComposerState(item, index);
      state.selectedMails = checked === true
        ? getUniqueMailRecipientRows(item?.inscripciones).map((recipient) => recipient.mail)
        : [];
      state.result = null;
    }

    function toggleMailRecipient(item, index, mail, checked) {
      const normalizedMail = normalizeMailValue(mail);
      if (!normalizedMail || !isValidMail(normalizedMail)) return;
      const state = getMailComposerState(item, index);
      const selected = getSelectedMailSet(item, index);

      if (checked) {
        selected.add(normalizedMail);
      } else {
        selected.delete(normalizedMail);
      }

      state.selectedMails = [...selected];
      state.result = null;
    }

    function setMailComposerOpen(item, index, open) {
      const state = getMailComposerState(item, index);
      state.open = open === true;
      if (state.open && !Array.isArray(state.selectedMails)) {
        syncMailSelectionState(item, index);
      }
      state.result = null;
    }

    function updateMailComposerField(item, index, field, value) {
      const state = getMailComposerState(item, index);
      if (field === "subject") {
        state.subject = String(value ?? "").slice(0, 160);
      }
      if (field === "message") {
        state.message = String(value ?? "").slice(0, 6000);
      }
      state.result = null;
    }

    function buildMailResultText(result) {
      if (!result) return "";
      const sent = Number(result.enviados || 0);
      const recipients = Number(result.destinatarios || 0);
      const failed = Number(result.fallidos || 0);
      const skipped = [
        Number(result.duplicados || 0) > 0 ? `${result.duplicados} duplicados` : "",
        Number(result.sin_mail || 0) > 0 ? `${result.sin_mail} sin mail` : "",
        Number(result.mails_invalidos || 0) > 0 ? `${result.mails_invalidos} invalidos` : ""
      ].filter(Boolean).join(", ");
      const base = result.ok
        ? `Enviados ${sent} de ${recipients} mails.`
        : (result.error || "No se pudo enviar el mail masivo.");
      const failedText = failed > 0 ? ` Fallidos: ${failed}.` : "";
      const skippedText = skipped ? ` Omitidos: ${skipped}.` : "";
      const failedDetail = Array.isArray(result.fallidos_detalle) && result.fallidos_detalle[0]
        ? String(result.fallidos_detalle[0].detail || result.fallidos_detalle[0].type || "").trim()
        : "";
      const detailText = failedDetail ? ` Motivo: ${failedDetail}` : "";
      return `${base}${failedText}${skippedText}${detailText}`.trim();
    }

    async function sendEventMail(eventItem, subject, message, selectedMails) {
      const response = await fetch("/api/admin-inscripciones", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          action: "send_event_email",
          evento: eventItem?.evento || "",
          asunto: subject,
          mensaje: message,
          destinatarios: Array.isArray(selectedMails) ? selectedMails : []
        })
      });

      if (response.status === 401) {
        window.location.href = ADMIN_LOGIN_URL;
        return { ok: false, redirected: true };
      }

      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) {
        const error = new Error(data.error || "No se pudo enviar el mail masivo.");
        error.data = data;
        throw error;
      }

      return data;
    }

    function getAttendanceLookup(item, index) {
      const key = getEventKey(item, index);
      if (!attendanceLookupByEvent.has(key)) {
        attendanceLookupByEvent.set(key, {
          searched: false,
          numero: "",
          dayKey: "",
          row: null,
          error: ""
        });
      }
      return attendanceLookupByEvent.get(key);
    }

    function getLunchLookup(item, index) {
      const key = getEventKey(item, index);
      if (!lunchLookupByEvent.has(key)) {
        lunchLookupByEvent.set(key, {
          searched: false,
          numero: "",
          row: null,
          error: ""
        });
      }
      return lunchLookupByEvent.get(key);
    }

    function getRaffleDrawCount(item, index, eligibleCount, dayKey = "") {
      const key = getScopedEventKey(item, index, dayKey);
      const fallback = 1;
      const maxValue = Math.max(eligibleCount || 0, 1);
      const savedValue = Number.parseInt(String(raffleCountByEvent.get(key) ?? ""), 10);
      const nextValue = Number.isFinite(savedValue)
        ? Math.max(1, Math.min(savedValue, maxValue))
        : Math.min(fallback, maxValue);
      raffleCountByEvent.set(key, nextValue);
      return nextValue;
    }

    function setRaffleDrawCount(item, index, nextValue, eligibleCount, dayKey = "") {
      const key = getScopedEventKey(item, index, dayKey);
      const maxValue = Math.max(eligibleCount || 0, 1);
      const parsedValue = Number.parseInt(String(nextValue ?? ""), 10);
      const normalizedValue = Number.isFinite(parsedValue)
        ? Math.max(1, Math.min(parsedValue, maxValue))
        : 1;
      raffleCountByEvent.set(key, normalizedValue);
      return normalizedValue;
    }

    function getRaffleBrandState(item, index, dayKey = "") {
      const key = getScopedEventKey(item, index, dayKey);
      return normalizeBrandKey(raffleBrandByEvent.get(key));
    }

    function setRaffleBrandState(item, index, brandKey, dayKey = "") {
      const key = getScopedEventKey(item, index, dayKey);
      const normalizedBrandKey = normalizeBrandKey(brandKey);
      if (!normalizedBrandKey) {
        raffleBrandByEvent.delete(key);
        return "";
      }
      raffleBrandByEvent.set(key, normalizedBrandKey);
      return normalizedBrandKey;
    }

    function normalizeDniValue(value) {
      return String(value ?? "").replace(/\D+/g, "").trim();
    }

    function findInscriptoByDni(eventItem, dni) {
      const normalizedDni = normalizeDniValue(dni);
      if (!normalizedDni) return null;
      const rows = Array.isArray(eventItem?.inscripciones) ? eventItem.inscripciones : [];
      return rows.find((entry) => normalizeDniValue(entry.dni) === normalizedDni) || null;
    }

    function searchAttendanceByDni(item, index, rawDni, dayKey = "") {
      const state = getAttendanceLookup(item, index);
      const cleaned = normalizeDniValue(rawDni);
      const selectedDay = isSanLuisEvent(item)
        ? normalizeAttendanceDayKey(dayKey || getSelectedAttendanceDay(item, index))
        : "";

      state.searched = true;
      state.numero = cleaned;
      state.dayKey = selectedDay;
      state.row = null;
      state.error = "";

      if (isSanLuisEvent(item) && !selectedDay) {
        state.error = "Selecciona si la asistencia es para viernes 7/8 o sabado 8/8.";
        return;
      }

      if (!cleaned) {
        state.error = "Ingresa un DNI valido.";
        return;
      }

      const rows = Array.isArray(item?.inscripciones) ? item.inscripciones : [];
      const found = rows.find((entry) => {
        const rowDni = normalizeDniValue(entry.dni);
        return rowDni === cleaned;
      }) || null;

      if (!found) {
        state.error = "No se encontro una persona con ese DNI en este encuentro.";
        return;
      }

      state.row = found;
      state.numero = cleaned;
    }

    function searchLunchByDni(item, index, rawDni) {
      const state = getLunchLookup(item, index);
      const cleaned = normalizeDniValue(rawDni);

      state.searched = true;
      state.numero = cleaned;
      state.row = null;
      state.error = "";

      if (!cleaned) {
        state.error = "Ingresa un DNI valido.";
        return;
      }

      const rows = Array.isArray(item?.inscripciones) ? item.inscripciones : [];
      const found = rows.find((entry) => {
        const rowDni = normalizeDniValue(entry.dni);
        return rowDni === cleaned;
      }) || null;

      if (!found) {
        state.error = "No se encontro una persona con ese DNI en este encuentro.";
        return;
      }

      state.row = found;
      state.numero = cleaned;
    }

    function updateAttendanceStateLocally(eventItem, dni, asistio, dayKey = "") {
      const normalizedDni = normalizeDniValue(dni);
      const normalizedDayKey = normalizeAttendanceDayKey(dayKey);
      const rows = Array.isArray(eventItem?.inscripciones) ? eventItem.inscripciones : [];
      for (const row of rows) {
        if (normalizeDniValue(row?.dni) === normalizedDni) {
          if (normalizedDayKey) {
            row.asistencia_dias = row.asistencia_dias && typeof row.asistencia_dias === "object"
              ? row.asistencia_dias
              : {};
            row.asistencia_dias[normalizedDayKey] = asistio === true;
            row.asistio = Object.values(row.asistencia_dias).some(Boolean);
          } else {
            row.asistio = asistio === true;
          }
        }
      }
    }

    function updateLunchStateLocally(eventItem, dni, almuerzo) {
      const normalizedDni = normalizeDniValue(dni);
      const rows = Array.isArray(eventItem?.inscripciones) ? eventItem.inscripciones : [];
      for (const row of rows) {
        if (normalizeDniValue(row?.dni) === normalizedDni) {
          row.almuerzo = almuerzo === true;
        }
      }
    }

    function getUniqueRowsByDni(rows) {
      const list = Array.isArray(rows) ? rows : [];
      const uniqueRows = [];
      const seen = new Set();

      for (const row of list) {
        const normalizedDni = normalizeDniValue(row?.dni);
        if (!normalizedDni || seen.has(normalizedDni)) continue;
        seen.add(normalizedDni);
        uniqueRows.push(row);
      }

      return uniqueRows;
    }

    function buildAttendanceResultHtml(item, index) {
      const rows = Array.isArray(item?.inscripciones) ? item.inscripciones : [];
      if (rows.length === 0) {
        return `<p class="attendance-hint">No hay inscriptos para buscar en este encuentro.</p>`;
      }

      const state = getAttendanceLookup(item, index);

      if (!state.searched) {
        return `<p class="attendance-hint">Ingresa un DNI para ver los datos.</p>`;
      }

      if (state.error) {
        return `<p class="attendance-error">${escapeHtml(state.error)}</p>`;
      }

      if (!state.row) {
        return `<p class="attendance-hint">No se encontro informacion del DNI buscado.</p>`;
      }

      const latestRow = findInscriptoByDni(item, state.row?.dni);
      const row = latestRow || state.row;
      const selectedDay = isSanLuisEvent(item)
        ? normalizeAttendanceDayKey(state.dayKey || getSelectedAttendanceDay(item, index))
        : "";

      const dayLabel = getDayLabel(selectedDay);

      return `
        <div class="attendance-result">
          <p class="attendance-row"><strong>DNI:</strong> ${escapeHtml(row.dni || "-")}</p>

          <p class="attendance-row"><strong>Mail:</strong> ${escapeHtml(row.mail || "-")}</p>
          <p class="attendance-row"><strong>Localidad:</strong> ${escapeHtml(row.localidad || "-")}</p>
          <p class="attendance-row"><strong>Empresa:</strong> ${escapeHtml(row.expositor_info || "-")}</p>
          ${dayLabel ? `<p class="attendance-row"><strong>Dia:</strong> ${escapeHtml(dayLabel)}</p>` : ""}
          <p class="attendance-row"><strong>Reconfirmacion:</strong> ${row?.reconfirmado === true ? "Si" : "No"}</p>
          <div class="attendance-check-wrap">
            <button
              class="btn-attendance-check ${confirmed ? "is-done" : ""}"
              type="button"
              data-attendance-confirm="${index}"
              data-attendance-dni="${escapeHtml(row.dni ?? "")}"
              data-attendance-day="${escapeHtml(selectedDay)}"
            >
              ${confirmed ? `&#10003; Asistencia ${dayLabel ? `${escapeHtml(dayLabel)} ` : ""}marcada` : `&#10003; Marcar asistencia${dayLabel ? ` ${escapeHtml(dayLabel)}` : ""}`}
            </button>
          </div>
        </div>
      `;
    }

    function buildLunchResultHtml(item, index) {
      const rows = Array.isArray(item?.inscripciones) ? item.inscripciones : [];
      if (rows.length === 0) {
        return `<p class="attendance-hint">No hay inscriptos para buscar en este encuentro.</p>`;

    function getEligibleRaffleRows(eventItem, dayKey = "") {
      const rows = getUniqueRowsByDni(eventItem?.inscripciones);
      const selectedDay = isSanLuisEvent(eventItem) ? normalizeAttendanceDayKey(dayKey) : "";
      if (isSanLuisEvent(eventItem) && !selectedDay) {
        return [];
      }
      return rows.filter(
        (row) =>
          getRowAttendanceForDay(row, selectedDay) &&
          getRowRaffleStateForDay(row, selectedDay).sorteado !== true &&
          normalizeDniValue(row?.dni)
      );
    }

    function getRaffleWinners(eventItem, dayKey = "") {
      const rows = getUniqueRowsByDni(eventItem?.inscripciones);
      const selectedDay = isSanLuisEvent(eventItem) ? normalizeAttendanceDayKey(dayKey) : "";
      if (isSanLuisEvent(eventItem) && !selectedDay) {
        return [];
      }
      return rows.filter(
        (row) => getRowRaffleStateForDay(row, selectedDay).sorteado === true && normalizeDniValue(row?.dni)
      );
    }

    function getRaffleState(item, index, dayKey = "") {
      const key = getScopedEventKey(item, index, dayKey);
      const saved = raffleWinnerByEvent.get(key);
      return Array.isArray(saved) ? saved : [];
    }

    function setRaffleState(item, index, rows, dayKey = "") {
      const key = getScopedEventKey(item, index, dayKey);
      if (!Array.isArray(rows) || rows.length === 0) {
        raffleWinnerByEvent.delete(key);
        return;
      }
      raffleWinnerByEvent.set(key, rows);
    }

    function updateRaffleStateLocally(eventItem, dni, sorteado, brandKey, dayKey = "") {
      const normalizedDni = normalizeDniValue(dni);
      const normalizedBrandKey = normalizeBrandKey(brandKey);
      const normalizedDayKey = normalizeAttendanceDayKey(dayKey);
      const rows = Array.isArray(eventItem?.inscripciones) ? eventItem.inscripciones : [];
      let matchedRow = null;

      for (const row of rows) {
        if (normalizeDniValue(row?.dni) !== normalizedDni) continue;
        if (normalizedDayKey) {
          row.sorteo_dias = row.sorteo_dias && typeof row.sorteo_dias === "object"
            ? row.sorteo_dias
            : {};
          row.sorteo_dias[normalizedDayKey] = {
            sorteado: sorteado === true,
            marca_sorteo: sorteado === true ? normalizedBrandKey : ""
          };
          row.sorteado = Object.values(row.sorteo_dias).some((item) => item?.sorteado === true);
          row.marca_sorteo =
            Object.values(row.sorteo_dias).find((item) => item?.marca_sorteo)?.marca_sorteo || "";
        } else {
          row.sorteado = sorteado === true;
          if (row.sorteado !== true) {
            row.marca_sorteo = "";
          } else if (normalizedBrandKey) {
            row.marca_sorteo = normalizedBrandKey;
          }
        }
        if (!matchedRow) {
          matchedRow = row;
        }
      }

      return matchedRow;
    }

    function groupRaffleWinnersByBrand(rows, dayKey = "") {
      const groups = new Map();
      const selectedDay = normalizeAttendanceDayKey(dayKey);
      for (const row of Array.isArray(rows) ? rows : []) {
        const dayState = getRowRaffleStateForDay(row, selectedDay);
        const brandKey = normalizeBrandKey(dayState.marca_sorteo || row?.marca_sorteo) || "sin_marca";
        if (!groups.has(brandKey)) {
          groups.set(brandKey, []);
        }
        groups.get(brandKey).push(row);
      }
      return [...groups.entries()].map(([brandKey, winners]) => ({
        brandKey,
        brandLabel: getBrandLabel(brandKey),
        brandLogo: getBrandLogo(brandKey),
        winners
      }));
    }

    function buildRaffleBrandGroupsHtml(rows, options = {}) {

      const groups = groupRaffleWinnersByBrand(rows, dayKey);
      const canRemove = options.canRemove === true;
      const eventIndex = Number.isInteger(options.eventIndex) ? options.eventIndex : -1;
      return groups.map((group) => `
        <div class="raffle-brand-group">
          ${

              ? `<img class="raffle-brand-logo" src="${escapeHtml(group.brandLogo)}" alt="Logo ${escapeHtml(group.brandLabel)}" onerror="this.style.display='none'">`

          }

                      `
                      : ""
                  }
                </li>
              `).join("")}
            </ul>
          </div>
        </div>
      `).join("");
    }
