    function sanitizeFileName(value) {
      return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "") || "evento";
    }

    const ORIGEN_LABELS = {
      facebook: "Grupo de Facebook",
      grupo_whatsapp: "Grupo de WhatsApp",
      instagram: "Instagram de Plomeros",
      casa_sanitarios: "Casa de Sanitarios",
      centro_formacion: "Centro de Formacion"
    };

    function normalizeSummaryLabel(value, fallback = "Sin dato") {
      const text = String(value ?? "").trim();
      return text || fallback;
    }

    function titleizeKey(value) {
      const raw = String(value ?? "").trim().toLowerCase();
      if (!raw) return "Sin dato";
      if (raw === "caba") return "CABA";
      return raw
        .split("_")
        .map((part) => part ? part.charAt(0).toUpperCase() + part.slice(1) : "")
        .join(" ");
    }

    function normalizeAsociadoLabel(value) {
      const normalized = String(value ?? "").trim().toLowerCase();
      if (normalized === "si") return "Si";
      if (normalized === "no") return "No";
      return "Sin dato";
    }

    function normalizeOrigenLabel(value) {
      const normalized = String(value ?? "").trim().toLowerCase();
      return ORIGEN_LABELS[normalized] || normalizeSummaryLabel(value);
    }

    function getProfesionSummaryValues(row) {
      const source = String(row?.profesion_label || row?.profesion || "");
      const values = source
        .split(",")
        .map((item) => item.trim())
        .filter(Boolean);

      return values.length > 0 ? values : ["Sin dato"];
    }

    function buildSummaryEntries(rows, getValues) {
      const map = new Map();

      for (const row of Array.isArray(rows) ? rows : []) {
        const nextValues = getValues(row);
        const values = Array.isArray(nextValues) ? nextValues : [nextValues];

        for (const value of values) {
          const label = normalizeSummaryLabel(value);
          map.set(label, (map.get(label) || 0) + 1);
        }
      }

      return [...map.entries()].sort((a, b) =>
        b[1] - a[1] || a[0].localeCompare(b[0], "es")
      );
    }

    function formatSummaryPercent(count, total) {
      if (!Number.isFinite(count) || !Number.isFinite(total) || total <= 0) {
        return "0%";
      }

      const percent = (count / total) * 100;
      const rounded = Number.isInteger(percent) ? percent.toFixed(0) : percent.toFixed(1);
      return `${rounded.replace(".", ",")}%`;
    }

    function buildSummaryBar(count, total, color) {
      const percent = total > 0 ? Math.max(0, Math.min(100, Math.round((count / total) * 100))) : 0;

      return `
        <table cellpadding="0" cellspacing="0" style="width:180px;border-collapse:collapse;">
          <tr>
            <td style="width:${percent}%;height:12px;background:${color};"></td>
            <td style="width:${100 - percent}%;height:12px;background:#edf3fb;"></td>
          </tr>
        </table>
      `;
    }

    function buildSummaryNarrative(entries, total) {
      if (!Array.isArray(entries) || entries.length === 0 || total <= 0) {
        return "Sin datos para analizar en esta categoria.";
      }

      const [first, second] = entries;
      const [firstLabel, firstCount] = first;
      const firstPercent = formatSummaryPercent(firstCount, total);

      if (firstCount === total) {
        return `Todos los registros corresponden a ${firstLabel} (${firstCount} - ${firstPercent}).`;
      }

      let text = `Predomina ${firstLabel} con ${firstCount} registros (${firstPercent}).`;

      if (second) {
        const [secondLabel, secondCount] = second;
        const secondPercent = formatSummaryPercent(secondCount, total);
        text += ` Le sigue ${secondLabel} con ${secondCount} registros (${secondPercent}).`;
      }

      return text;
    }

    function buildSummarySection(title, entries, total, color) {
      const safeTitle = escapeHtml(title);
      const narrative = escapeHtml(buildSummaryNarrative(entries, total));

      return `
        <table border="1" style="margin:0 0 18px;border-collapse:collapse;">
          <thead>
            <tr>
              <th colspan="4" style="background:${color};color:#ffffff;">${safeTitle}</th>
            </tr>
            <tr>
              <th colspan="4" style="background:#f8fbff;color:#243b5a;text-align:left;font-weight:600;">${narrative}</th>
            </tr>
            <tr>
              <th>Categoria</th>
              <th>Cantidad</th>
              <th>Porcentaje</th>
              <th>Grafico</th>
            </tr>
          </thead>
          <tbody>
            ${
              entries.length > 0
                ? entries
                  .map(([label, count]) => `
                    <tr>
                      <td>${escapeHtml(label)}</td>
                      <td>${count}</td>
                      <td>${formatSummaryPercent(count, total)}</td>
                      <td>${buildSummaryBar(count, total, color)}</td>
                    </tr>
                  `)
                  .join("")
                : `
                  <tr>
                    <td colspan="4">Sin datos.</td>
                  </tr>
                `
            }
          </tbody>
        </table>
      `;
    }

    function buildSummaryExcelHtml(eventName, rows) {
      const list = Array.isArray(rows) ? rows : [];
      const total = list.length;
      const totalAsistencias = list.reduce((sum, row) => sum + (hasAnyDayAttendance(row) ? 1 : 0), 0);
      const totalAlmuerzos = list.reduce((sum, row) => sum + (row?.almuerzo === true ? 1 : 0), 0);
      const totalReconfirmados = list.reduce((sum, row) => sum + (row?.reconfirmado === true ? 1 : 0), 0);
      const totalAsociados = list.reduce(
        (sum, row) => sum + (normalizeAsociadoLabel(row?.asociado) === "Si" ? 1 : 0),
        0
      );

      const profesiones = buildSummaryEntries(list, (row) => getProfesionSummaryValues(row));
      const asociados = buildSummaryEntries(list, (row) => normalizeAsociadoLabel(row?.asociado));
      const provincias = buildSummaryEntries(list, (row) => titleizeKey(row?.provincia));
      const origenes = buildSummaryEntries(list, (row) => normalizeOrigenLabel(row?.origen));
      const asistencias = buildSummaryEntries(list, (row) => hasAnyDayAttendance(row) ? "Si" : "No");
      const almuerzos = buildSummaryEntries(list, (row) => row?.almuerzo === true ? "Si" : "No");
      const reconfirmaciones = buildSummaryEntries(list, (row) => row?.reconfirmado === true ? "Si" : "No");
      const safeEventName = escapeHtml(eventName || "Evento");
      const generatedAt = escapeHtml(formatDate(new Date().toISOString()));

      return `
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
          <head>
            <meta charset="UTF-8">
          </head>
          <body>
            <table border="1" style="margin:0 0 18px;border-collapse:collapse;">
              <thead>
                <tr>
                  <th colspan="2">Resumen con graficos - Evento ${safeEventName}</th>
                </tr>
              </thead>
              <tbody>
                <tr><td>Total inscriptos</td><td>${total}</td></tr>
                <tr><td>Total asistencias</td><td>${totalAsistencias}</td></tr>
                <tr><td>Total almuerzos</td><td>${totalAlmuerzos}</td></tr>
                <tr><td>Total reconfirmados</td><td>${totalReconfirmados}</td></tr>
                <tr><td>Total asociados</td><td>${totalAsociados}</td></tr>
                <tr><td>Generado</td><td>${generatedAt}</td></tr>
              </tbody>
            </table>
            ${buildSummarySection("Profesiones", profesiones, total, "#0f4ea8")}
            ${buildSummarySection("Asociados", asociados, total, "#1f7a45")}
            ${buildSummarySection("Provincias", provincias, total, "#7d4f00")}
            ${buildSummarySection("Origen", origenes, total, "#6b49a6")}
            ${buildSummarySection("Asistencia", asistencias, total, "#0f7a45")}
            ${buildSummarySection("Almuerzo", almuerzos, total, "#2f6f73")}
            ${buildSummarySection("Reconfirmacion", reconfirmaciones, total, "#b05c00")}
          </body>
        </html>
      `;
    }

    function buildExcelRows(rows, eventName = "") {
      const includeSanLuisDays = isSanLuisEvent(eventName);
      return rows
        .map((item) => `
          <tr>
            <td>${escapeHtml(item.id_evento ?? "-")}</td>

      if (!Array.isArray(rows) || rows.length === 0) {

      }

      const safeEventName = escapeHtml(eventName || "Evento");
      const includeSanLuisDays = isSanLuisEvent(eventName);

      const html = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">

      return `${window.location.origin}${rawPath.startsWith("/") ? rawPath : `/${rawPath}`}`;
    }

                <textarea name="descripcion" maxlength="300" placeholder="Texto corto para mostrar en el listado y en el mail"></textarea>
              </label>
              <label class="event-create-field is-wide">
                Ingreso solidario
                <textarea name="ingreso_solidario" maxlength="260" placeholder="Ej: Traer 2 alimentos no perecederos"></textarea>
              </label>
              <label class="event-create-field">
                Cupo
                <input name="cupo" type="number" min="1" step="1" placeholder="Opcional">
              </label>
            </div>

            <div class="event-create-switches">
              <label class="event-create-check">
                <input name="activo" type="checkbox" checked>
                Inscripcion activa
              </label>
              <label class="event-create-check">
                <input name="certificado_activo" type="checkbox" checked>
                Certificado visible
              </label>
              <label class="event-create-check">
                <input name="mail_opcional" type="checkbox">
                Mail opcional
              </label>
              <label class="event-create-check">
                <input name="asociado_opcional" type="checkbox">
                Asociado opcional
              </label>
              <label class="event-create-check">
                <input name="celular_obligatorio" type="checkbox">
                Celular obligatorio
              </label>

            <div class="event-create-actions">
              <button class="btn-event" type="submit" data-create-event-submit>Crear evento</button>
            </div>

          </form>

          <div class="event-catalog">
            <h3 class="event-catalog-title">Eventos disponibles</h3>
            <div class="event-catalog-list">
              ${
                eventList.length
                  ? eventList.map(buildEventCatalogRowHtml).join("")
                  : `<p class="empty">Todavia no hay eventos cargados.</p>`
              }
            </div>
          </div>
        </section>
      `;
    }

    function renderEvents(eventos) {
      currentEventos = Array.isArray(eventos) ? eventos : [];
      attendanceTotalValue.textContent = String(countAttendance(currentEventos));
      lunchTotalValue.textContent = String(countLunch(currentEventos));
      reconfirmTotalValue.textContent = String(countReconfirm(currentEventos));

      if (currentPanelView === PANEL_VIEW_CREAR_EVENTO) {
        eventsContainer.innerHTML = buildEventCreatorHtml(currentEventos);
        return;
      }

      if (!Array.isArray(eventos) || eventos.length === 0) {
        eventsContainer.innerHTML = `
          <article class="event-card">
            <p class="empty">No hay eventos para mostrar.</p>
          </article>
        `;
        return;
      }

      eventsContainer.innerHTML = eventos
        .map((item, index) => {
          const rows = Array.isArray(item.inscripciones) ? item.inscripciones : [];
          const attendanceCount = rows.reduce(
            (sum, row) => sum + (hasAnyDayAttendance(row) ? 1 : 0),
            0
          );
          const dayAttendanceCounts = isSanLuisEvent(item)
            ? SAN_LUIS_DAYS.map((day) => ({
                ...day,
                count: rows.reduce(
                  (sum, row) => sum + (getRowAttendanceForDay(row, day.key) ? 1 : 0),
                  0
                )
              }))
            : [];
          const lunchCount = rows.reduce(
            (sum, row) => sum + (row?.almuerzo === true ? 1 : 0),
            0
          );
          const reconfirmCount = rows.reduce(
            (sum, row) => sum + (row?.reconfirmado === true ? 1 : 0),
            0
          );
          const visibleRows = getVisibleRows(item, index, rows.length);
          const rowsToRender = rows.slice(0, visibleRows);
          const canShowMore = visibleRows < rows.length;
          const canShowLess = visibleRows > Math.min(DEFAULT_VISIBLE_ROWS, rows.length);
          const attendanceLookup = getAttendanceLookup(item, index);
          const selectedAttendanceDay = getSelectedAttendanceDay(item, index);
          const lunchLookup = getLunchLookup(item, index);
          const canViewInscripciones = currentAdminRole !== "asistencia";
          const canManageEvents = currentAdminRole === "admin";
          const showInscripciones = canViewInscripciones && currentPanelView === PANEL_VIEW_INSCRIPCIONES;
          const showAsistencia = currentPanelView === PANEL_VIEW_ASISTENCIA;
          const showLunch = currentPanelView === PANEL_VIEW_ALMUERZO;
          const showSorteos = canManageEvents && currentPanelView === PANEL_VIEW_SORTEOS;
          const showCertificados = canManageEvents && currentPanelView === PANEL_VIEW_CERTIFICADOS;
          const isExpanded = isEventExpanded(item, index);
          const showExpandControl = showInscripciones && rows.length > 0;
          const mailState = getMailComposerState(item, index);
          const showMailComposer = showInscripciones && canManageEvents && mailState.open;
          const mailRecipientCount = countUniqueMailRecipients(rows);

          const attendanceSectionHtml = `
            <section class="attendance-box">
              <h3 class="attendance-title">Asistencia encuentro</h3>
              <div class="attendance-form">
                ${isSanLuisEvent(item) ? `
                  <select
                    class="attendance-input attendance-day-select"
                    data-attendance-day-select="${index}"
                    ${rows.length === 0 ? "disabled" : ""}
                  >
                    ${buildDayOptionsHtml(selectedAttendanceDay)}
                  </select>
                ` : ""}
                <input
                  class="attendance-input"
                  type="text"
                  inputmode="numeric"
                  data-attendance-input="${index}"
                  placeholder="DNI"
                  value="${escapeHtml(attendanceLookup.numero || "")}"
                  ${rows.length === 0 ? "disabled" : ""}
                />
                <button
                  class="btn-event"
                  type="button"
                  data-attendance-search="${index}"
                  ${rows.length === 0 ? "disabled" : ""}
                >
                  Buscar
                </button>
              </div>
              ${buildAttendanceResultHtml(item, index)}
            </section>
          `;

          const lunchSectionHtml = `
            <section class="attendance-box">
              <h3 class="attendance-title">Almuerzo</h3>
              <div class="attendance-form">
                <input
                  class="attendance-input"
                  type="text"
                  inputmode="numeric"
                  data-lunch-input="${index}"
                  placeholder="DNI"
                  value="${escapeHtml(lunchLookup.numero || "")}"
                  ${rows.length === 0 ? "disabled" : ""}
                />
                <button
                  class="btn-event"
                  type="button"
                  data-lunch-search="${index}"
                  ${rows.length === 0 ? "disabled" : ""}
                >
                  Buscar
                </button>
              </div>
              ${buildLunchResultHtml(item, index)}
            </section>
          `;

          const inscripcionesSectionHtml =
            rows.length === 0
              ? `<p class="empty">No hay inscripciones en este evento.</p>`
              : `
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>ID encuentro</th>
                        <th>Fecha</th>
                        <th>Nombre y apellido</th>
                        <th>DNI</th>
                        <th>Mail</th>
                        <th>Numero de Ceular</th>
                        <th>Provincia</th>
                        <th>Localidad</th>
                        <th>Profesión</th>
                        <th>Empresa</th>
                        <th class="attendance-col">Asistio</th>
                        <th class="reconfirm-col">Reconfirmacion</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${buildRows(rowsToRender, item, index)}
                    </tbody>
                  </table>
                </div>
                <div class="rows-controls">
                  <span class="rows-info">Mostrando ${visibleRows} de ${rows.length}</span>
                  <button
                    class="btn-event"
                    type="button"
                    data-show-more="${index}"
                    ${canShowMore ? "" : "disabled"}
                  >
                    Ver m&aacute;s
                  </button>
                  <button
                    class="btn-event"
                    type="button"
                    data-show-less="${index}"
                    ${canShowLess ? "" : "disabled"}
                  >
                    Ver menos
                  </button>
                </div>
              `;

          const certificateSectionHtml = `
            <section class="certificate-box">
              <h3 class="certificate-title">Certificado asistencias</h3>
              <p class="certificate-hint">
                Define si este encuentro aparece en la pagina de certificados para los usuarios.
              </p>
              <div class="certificate-actions">
                <span class="event-state ${isCertificateVisible(item) ? "is-on" : "is-off"}">
                  ${isCertificateVisible(item) ? "Visible" : "Oculto"}
                </span>
                <button
                  class="btn-event btn-toggle ${isCertificateVisible(item) ? "is-on" : "is-off"}"
                  type="button"
                  data-toggle-certificate="${index}"
                  ${certificateToggleInFlight.has(index) ? "disabled" : ""}
                >
                  ${isCertificateVisible(item) ? "Ocultar certificado" : "Mostrar certificado"}
                </button>
              </div>
            </section>
          `;

          return `
            <article class="event-card ${showInscripciones && !isExpanded && !showMailComposer ? "is-collapsed" : ""}">
              <header class="event-head">
                <div class="event-heading">
                  ${
                    showExpandControl
                      ? `
                        <button
                          class="event-expand"
                          type="button"
                          data-toggle-rows="${index}"
                          aria-label="${isExpanded ? "Ocultar inscripciones" : "Mostrar inscripciones"}"
                          aria-expanded="${isExpanded ? "true" : "false"}"
                          title="${isExpanded ? "Ocultar inscripciones" : "Mostrar inscripciones"}"
                        >
                          <span class="event-expand-icon" aria-hidden="true"></span>
                        </button>
                      `
                      : ""
                  }
                  <h2 class="event-title">Evento ${escapeHtml(item.evento || "Sin evento")}</h2>
                </div>
                ${
                  showCertificados
                    ? ""
                    : `
                      <div class="event-meta">
                        <span class="counter">${rows.length} inscriptos</span>
                        <span class="counter counter-attendance">${attendanceCount} asistencias</span>
                        ${dayAttendanceCounts.map((day) => `
                          <span class="counter counter-attendance">${escapeHtml(day.label)}: ${day.count}</span>
                        `).join("")}
                        <span class="counter counter-attendance">${lunchCount} almuerzos</span>
                        <span class="counter counter-attendance">${reconfirmCount} reconfirmados</span>
                        <span class="event-state ${isEventActive(item) ? "is-on" : "is-off"}">
                          ${isEventActive(item) ? "Activo" : "Inactivo"}
                        </span>
                        ${
                          canManageEvents
                            ? `
                              <button
                                class="btn-event btn-toggle ${isEventActive(item) ? "is-on" : "is-off"}"
                                type="button"
                                data-toggle-event="${index}"
                                ${toggleInFlight.has(index) ? "disabled" : ""}
                              >
                                ${isEventActive(item) ? "Desactivar" : "Activar"}
                              </button>
                            `
                            : ""
                        }
                        ${
                          showInscripciones && canManageEvents
                            ? `
                              <button
                                class="btn-event"
                                type="button"
                                data-download-event="${index}"
                                ${rows.length === 0 ? "disabled" : ""}
                              >
                                Descargar Excel
                              </button>
                              <button
                                class="btn-event"
                                type="button"
                                data-download-summary-event="${index}"
                                ${rows.length === 0 ? "disabled" : ""}
                              >
                                Descargar resumen
                              </button>
                              <button
                                class="btn-event"
                                type="button"
                                data-toggle-mail-composer="${index}"
                                ${mailRecipientCount === 0 || mailInFlight.has(index) ? "disabled" : ""}
                              >
                                ${showMailComposer ? "Ocultar mail" : "Enviar mail"}
                              </button>
                            `
                            : ""
                        }
                      </div>
                    `
                }
              </header>
              ${showMailComposer ? buildMailSectionHtml(item, index) : ""}
              ${showAsistencia ? attendanceSectionHtml : ""}
              ${showLunch ? lunchSectionHtml : ""}
              ${showInscripciones && isExpanded ? inscripcionesSectionHtml : ""}
              ${showSorteos ? buildRaffleSectionHtml(item, index) : ""}
              ${showCertificados ? certificateSectionHtml : ""}
            </article>
          `;
        })
        .join("");
    }

    async function loadData() {
      setStatusMessage("Actualizando datos...");
      refreshBtn.disabled = true;

      try {
        const response = await fetch("/api/admin-inscripciones", {
          method: "GET",
          headers: { "Accept": "application/json" }
        });

        if (response.status === 401) {
          window.location.href = ADMIN_LOGIN_URL;
          return;
        }

        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.ok) {
          throw new Error(data.error || "No se pudo cargar el panel.");
        }

        currentAdminRole = String(data.role || "admin").toLowerCase() === "asistencia"
          ? "asistencia"
          : "admin";
        if (currentAdminRole === "asistencia") {
          currentPanelView = PANEL_VIEW_ASISTENCIA;
        }
        renderViewButtons();

        totalValue.textContent = String(data.total ?? 0);
        updatedAt.textContent = data.generated_at
          ? `Actualizado: ${formatDate(data.generated_at)}`
          : "Actualizado";

        renderEvents(data.eventos || []);
        const warnings = [
          String(data.catalog_warning || "").trim(),
          String(data.status_warning || "").trim(),
          String(data.certificate_status_warning || "").trim()
        ].filter(Boolean);

        if (warnings.length > 0) {
          setStatusMessage(warnings.join(" | "), "warning");
        } else {
          setStatusMessage("Datos cargados correctamente.");
        }
      } catch (error) {
        setStatusMessage(`Error: ${error.message}`, "error");
      } finally {
        refreshBtn.disabled = false;
      }
    }

    async function toggleEvent(index) {
      if (!Number.isInteger(index) || toggleInFlight.has(index)) return;

      const selected = currentEventos[index];
      if (!selected || !selected.evento) return;

      const nextActive = !isEventActive(selected);
      toggleInFlight.add(index);
      renderEvents(currentEventos);

      try {
        const response = await fetch("/api/admin-inscripciones", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            evento: selected.evento,
            activo: nextActive
          })
        });

        if (response.status === 401) {
          window.location.href = ADMIN_LOGIN_URL;
          return;
        }

        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.ok) {
          const sqlHint = typeof data.sql === "string" && data.sql ? ` SQL: ${data.sql}` : "";
          throw new Error((data.error || "No se pudo actualizar el estado.") + sqlHint);
        }

        selected.activo = data.activo !== false;
        renderEvents(currentEventos);
        setStatusMessage(
          `Evento ${selected.evento}: ${selected.activo ? "activo" : "inactivo"}.`
        );
      } catch (error) {
        setStatusMessage(`Error: ${error.message}`, "error");
      } finally {
        toggleInFlight.delete(index);
        renderEvents(currentEventos);
      }
    }

    async function toggleCertificate(index) {
      if (!Number.isInteger(index) || certificateToggleInFlight.has(index)) return;

      const selected = currentEventos[index];
      if (!selected || !selected.evento) return;

      const nextVisible = !isCertificateVisible(selected);
      certificateToggleInFlight.add(index);
      renderEvents(currentEventos);

      try {
        const response = await fetch("/api/admin-inscripciones", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            action: "set_certificado_visible",
            evento: selected.evento,
            certificado_activo: nextVisible
          })
        });

        if (response.status === 401) {
          window.location.href = ADMIN_LOGIN_URL;
          return;
        }

        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) {
          const sqlHint = typeof data.sql === "string" && data.sql ? ` SQL: ${data.sql}` : "";
          throw new Error((data.error || "No se pudo actualizar certificados.") + sqlHint);
        }

        selected.certificado_activo = data.certificado_activo !== false;
        renderEvents(currentEventos);
        setStatusMessage(
          `Certificados de ${selected.evento}: ${selected.certificado_activo ? "visibles" : "ocultos"}.`
        );
      } catch (error) {
        setStatusMessage(`Error: ${error.message}`, "error");
      } finally {
        certificateToggleInFlight.delete(index);
        renderEvents(currentEventos);
      }
    }

    function getFormText(form, fieldName) {
      return String(new FormData(form).get(fieldName) || "").trim();
    }

    function getFormChecked(form, fieldName) {
      const field = form.elements[fieldName];
      return Boolean(field && field.checked);
    }

    function buildCreateEventPayload(form) {
      return {
        action: "create_event",
        nombre: getFormText(form, "nombre"),
        numero: getFormText(form, "numero"),
        ciudad: getFormText(form, "ciudad"),
        provincia: getFormText(form, "provincia"),
        fecha: getFormText(form, "fecha"),
        horario: getFormText(form, "horario"),
        lugar: getFormText(form, "lugar"),
        direccion: getFormText(form, "direccion"),
        maps_url: getFormText(form, "maps_url"),
        whatsapp_url: getFormText(form, "whatsapp_url"),
        imagen_url: getFormText(form, "imagen_url"),
        descripcion: getFormText(form, "descripcion"),
        ingreso_solidario: getFormText(form, "ingreso_solidario"),
        cupo: getFormText(form, "cupo"),
        activo: getFormChecked(form, "activo"),
        certificado_activo: getFormChecked(form, "certificado_activo"),
        mail_opcional: getFormChecked(form, "mail_opcional"),
        asociado_opcional: getFormChecked(form, "asociado_opcional"),
        celular_obligatorio: getFormChecked(form, "celular_obligatorio")
      };
    }

    function showCreateEventResult(form, html, isError = false) {
      const resultBox = form.querySelector("[data-create-event-result]");
      if (!resultBox) return;
      resultBox.hidden = false;
      resultBox.classList.toggle("is-error", isError);
      resultBox.innerHTML = html;
    }

    function upsertCreatedEventLocally(eventItem) {
      if (!eventItem?.evento) return;
      const nextEvent = {
        ...eventItem,
        contador: eventItem.contador || 0,
        inscripciones: Array.isArray(eventItem.inscripciones) ? eventItem.inscripciones : []
      };
      const existingIndex = currentEventos.findIndex((item) => item?.evento === nextEvent.evento);
      if (existingIndex >= 0) {
        currentEventos[existingIndex] = {
          ...currentEventos[existingIndex],
          ...nextEvent
        };
      } else {
        currentEventos.push(nextEvent);
      }
    }

    function resetCreateEventForm(form) {
      form.reset();
      if (form.elements.activo) {
        form.elements.activo.checked = true;
      }
      if (form.elements.certificado_activo) {
        form.elements.certificado_activo.checked = true;
      }
    }

    async function submitCreateEvent(form) {
      const submitButton = form.querySelector("[data-create-event-submit]");
      const payload = buildCreateEventPayload(form);

      if (!payload.nombre) {
        showCreateEventResult(form, "Escribi el nombre del evento.", true);
        return;
      }

      if (submitButton) {
        submitButton.disabled = true;
      }

      try {
        const response = await fetch("/api/admin-inscripciones", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (response.status === 401) {
          window.location.href = ADMIN_LOGIN_URL;
          return;
        }

        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.ok) {
          const sqlHint = typeof data.sql === "string" && data.sql
            ? `<pre class="event-create-sql">${escapeHtml(data.sql)}</pre>`
            : "";
          showCreateEventResult(
            form,
            `${escapeHtml(data.error || "No se pudo crear el evento.")}${sqlHint}`,
            true
          );
          return;
        }

        const eventItem = data.evento || {};
        const publicUrl = buildAbsolutePublicUrl(eventItem.inscripcion_url || "");
        upsertCreatedEventLocally(eventItem);
        setStatusMessage(`Evento ${eventItem.evento || payload.nombre} creado correctamente.`);
        showCreateEventResult(
          form,
          `
            <strong>Evento creado correctamente.</strong>
            ${
              publicUrl
                ? `<span>Link de inscripcion: <a href="${escapeHtml(publicUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(publicUrl)}</a></span>`
                : ""
            }
            ${data.warning ? `<span>${escapeHtml(data.warning)}</span>` : ""}
            ${data.sql ? `<pre class="event-create-sql">${escapeHtml(data.sql)}</pre>` : ""}
          `
        );
        resetCreateEventForm(form);

        const catalogList = eventsContainer.querySelector(".event-catalog-list");
        if (catalogList && eventItem.evento) {
          catalogList.innerHTML = currentEventos
            .filter((item) => item?.evento && item.evento !== "Sin evento")
            .map(buildEventCatalogRowHtml)
            .join("");
        }
      } catch (error) {
        showCreateEventResult(
          form,
          `Error: ${escapeHtml(error instanceof Error ? error.message : "No se pudo crear el evento.")}`,
          true
        );
      } finally {
        if (submitButton) {
          submitButton.disabled = false;
        }
      }
    }

    eventsContainer.addEventListener("submit", (event) => {
      const form = event.target.closest("[data-create-event-form]");
      if (!form) return;
      event.preventDefault();
      submitCreateEvent(form);
    });

    eventsContainer.addEventListener("input", (event) => {
      const subjectInput = event.target.closest("[data-mail-subject]");
      if (subjectInput) {
        const index = Number.parseInt(subjectInput.getAttribute("data-mail-subject"), 10);
        if (!Number.isInteger(index)) return;
        const selected = currentEventos[index];
        if (!selected) return;
        updateMailComposerField(selected, index, "subject", subjectInput.value);
        return;
      }

      const messageInput = event.target.closest("[data-mail-message]");
      if (messageInput) {
        const index = Number.parseInt(messageInput.getAttribute("data-mail-message"), 10);
        if (!Number.isInteger(index)) return;
        const selected = currentEventos[index];
        if (!selected) return;
        updateMailComposerField(selected, index, "message", messageInput.value);
      }
    });

    eventsContainer.addEventListener("click", async (event) => {
      const toggleButton = event.target.closest("[data-toggle-event]");
      if (toggleButton) {
        const toggleIndex = Number.parseInt(toggleButton.getAttribute("data-toggle-event"), 10);
        await toggleEvent(toggleIndex);
        return;
      }

      const toggleCertificateButton = event.target.closest("[data-toggle-certificate]");
      if (toggleCertificateButton) {
        const toggleCertificateIndex = Number.parseInt(
          toggleCertificateButton.getAttribute("data-toggle-certificate"),
          10
        );
        await toggleCertificate(toggleCertificateIndex);
        return;
      }

      const mailToggleButton = event.target.closest("[data-toggle-mail-composer]");
      if (mailToggleButton) {
        const mailIndex = Number.parseInt(
          mailToggleButton.getAttribute("data-toggle-mail-composer"),
          10
        );
        if (!Number.isInteger(mailIndex)) return;
        const selected = currentEventos[mailIndex];
        if (!selected) return;
        const state = getMailComposerState(selected, mailIndex);
        setMailComposerOpen(selected, mailIndex, !state.open);
        renderEvents(currentEventos);
        return;
      }

      const mailCloseButton = event.target.closest("[data-close-mail-composer]");
      if (mailCloseButton) {
        const mailIndex = Number.parseInt(
          mailCloseButton.getAttribute("data-close-mail-composer"),
          10
        );
        if (!Number.isInteger(mailIndex)) return;
        const selected = currentEventos[mailIndex];
        if (!selected) return;
        setMailComposerOpen(selected, mailIndex, false);
        renderEvents(currentEventos);
        return;
      }

      const mailSelectAllButton = event.target.closest("[data-mail-select-all]");
      if (mailSelectAllButton) {
        const mailIndex = Number.parseInt(
          mailSelectAllButton.getAttribute("data-mail-select-all"),
          10
        );
        if (!Number.isInteger(mailIndex)) return;
        const selected = currentEventos[mailIndex];
        if (!selected) return;
        setAllMailRecipients(selected, mailIndex, true);
        renderEvents(currentEventos);
        return;
      }

      const mailClearAllButton = event.target.closest("[data-mail-clear-all]");
      if (mailClearAllButton) {
        const mailIndex = Number.parseInt(
          mailClearAllButton.getAttribute("data-mail-clear-all"),
          10
        );
        if (!Number.isInteger(mailIndex)) return;
        const selected = currentEventos[mailIndex];
        if (!selected) return;
        setAllMailRecipients(selected, mailIndex, false);
        renderEvents(currentEventos);
        return;
      }

      const mailSendButton = event.target.closest("[data-send-event-mail]");
      if (mailSendButton) {
        const mailIndex = Number.parseInt(
          mailSendButton.getAttribute("data-send-event-mail"),
          10
        );
        if (!Number.isInteger(mailIndex) || mailInFlight.has(mailIndex)) return;

        const selected = currentEventos[mailIndex];
        if (!selected) return;

        const state = getMailComposerState(selected, mailIndex);
        const subjectInput = eventsContainer.querySelector(`[data-mail-subject="${mailIndex}"]`);
        const messageInput = eventsContainer.querySelector(`[data-mail-message="${mailIndex}"]`);
        const subject = String(subjectInput?.value || "").trim();
        const message = String(messageInput?.value || "").trim();
        const selectedMails = syncMailSelectionState(selected, mailIndex);
        const recipientCount = selectedMails.length;

        updateMailComposerField(selected, mailIndex, "subject", subject);
        updateMailComposerField(selected, mailIndex, "message", message);

        if (subject.length < 4) {
          state.result = { ok: false, error: "Tenes que escribir un asunto." };
          renderEvents(currentEventos);
          return;
        }

        if (message.length < 10) {
          state.result = { ok: false, error: "Tenes que escribir un mensaje." };
          renderEvents(currentEventos);
          return;
        }

        if (recipientCount === 0) {
          state.result = { ok: false, error: "No hay mails validos para este encuentro." };
          renderEvents(currentEventos);
          return;
        }

        const confirmed = window.confirm(
          `Vas a enviar un mail real a ${recipientCount} destinatarios de ${selected.evento}. Continuar?`
        );
        if (!confirmed) return;

        mailInFlight.add(mailIndex);
        state.result = null;
        setStatusMessage(`Enviando mail masivo de ${selected.evento}...`);
        renderEvents(currentEventos);

        try {
          const result = await sendEventMail(selected, subject, message, selectedMails);
          if (result.redirected) return;

          state.result = { ...result, ok: true };
          setStatusMessage(buildMailResultText(state.result));
        } catch (error) {
          state.result = {
            ...(error?.data && typeof error.data === "object" ? error.data : {}),
            ok: false,
            error: error instanceof Error ? error.message : "No se pudo enviar el mail masivo."
          };
          setStatusMessage(`Error: ${state.result.error}`, "error");
        } finally {
          mailInFlight.delete(mailIndex);
          renderEvents(currentEventos);
        }
        return;
      }

      const attendanceSearchButton = event.target.closest("[data-attendance-search]");
      if (attendanceSearchButton) {
        const searchIndex = Number.parseInt(
          attendanceSearchButton.getAttribute("data-attendance-search"),
          10
        );
        if (!Number.isInteger(searchIndex)) return;
        const selected = currentEventos[searchIndex];
        if (!selected) return;

        const input = eventsContainer.querySelector(`[data-attendance-input="${searchIndex}"]`);
        const inputValue = input ? input.value : "";
        const dayKey = getSelectedAttendanceDay(selected, searchIndex);
        searchAttendanceByDni(selected, searchIndex, inputValue, dayKey);
        renderEvents(currentEventos);
        return;
      }

      const attendanceConfirmButton = event.target.closest("[data-attendance-confirm]");
      if (attendanceConfirmButton) {
        const confirmIndex = Number.parseInt(
          attendanceConfirmButton.getAttribute("data-attendance-confirm"),
          10
        );
        if (!Number.isInteger(confirmIndex)) return;
        const selected = currentEventos[confirmIndex];
        if (!selected) return;
        const dniValue = attendanceConfirmButton.getAttribute("data-attendance-dni");
        const normalizedDni = normalizeDniValue(dniValue);
        if (!normalizedDni) return;
        const dayKey = normalizeAttendanceDayKey(
          attendanceConfirmButton.getAttribute("data-attendance-day") ||
          getSelectedAttendanceDay(selected, confirmIndex)
        );

        if (isSanLuisEvent(selected) && !dayKey) {
          setStatusMessage("Selecciona viernes 7/8 o sabado 8/8 antes de guardar asistencia.", "error");
          return;
        }

        try {
          attendanceConfirmButton.disabled = true;
          const saveResult = await persistAttendanceState(selected, normalizedDni, true, dayKey);
          if (saveResult.redirected) return;
          updateAttendanceStateLocally(selected, normalizedDni, saveResult.asistio, saveResult.dia || dayKey);
          setStatusMessage(
            `Asistencia${getDayLabel(saveResult.dia || dayKey) ? ` ${getDayLabel(saveResult.dia || dayKey)}` : ""} guardada correctamente.`
          );
        } catch (error) {
          setStatusMessage(`Error: ${error.message}`, "error");
        } finally {
          renderEvents(currentEventos);
        }
        return;
      }

      const lunchSearchButton = event.target.closest("[data-lunch-search]");
      if (lunchSearchButton) {
        const searchIndex = Number.parseInt(
          lunchSearchButton.getAttribute("data-lunch-search"),
          10
        );
        if (!Number.isInteger(searchIndex)) return;
        const selected = currentEventos[searchIndex];
        if (!selected) return;

        const input = eventsContainer.querySelector(`[data-lunch-input="${searchIndex}"]`);
        const inputValue = input ? input.value : "";
        searchLunchByDni(selected, searchIndex, inputValue);
        renderEvents(currentEventos);
        return;
      }

      const lunchConfirmButton = event.target.closest("[data-lunch-confirm]");
      if (lunchConfirmButton) {
        const confirmIndex = Number.parseInt(
          lunchConfirmButton.getAttribute("data-lunch-confirm"),
          10
        );
        if (!Number.isInteger(confirmIndex)) return;
        const selected = currentEventos[confirmIndex];
        if (!selected) return;
        const dniValue = lunchConfirmButton.getAttribute("data-lunch-dni");
        const normalizedDni = normalizeDniValue(dniValue);
        if (!normalizedDni) return;

        try {
          lunchConfirmButton.disabled = true;
          const saveResult = await persistLunchState(selected, normalizedDni, true);
          if (saveResult.redirected) return;
          updateLunchStateLocally(selected, normalizedDni, saveResult.almuerzo);
          setStatusMessage("Almuerzo guardado correctamente.");
        } catch (error) {
          setStatusMessage(`Error: ${error.message}`, "error");
        } finally {
          renderEvents(currentEventos);
        }
        return;
      }

      const rowToggleButton = event.target.closest("[data-toggle-rows]");
      if (rowToggleButton) {
        const toggleRowsIndex = Number.parseInt(rowToggleButton.getAttribute("data-toggle-rows"), 10);
        if (!Number.isInteger(toggleRowsIndex)) return;
        const selected = currentEventos[toggleRowsIndex];
        if (!selected) return;
        const totalRows = Array.isArray(selected.inscripciones) ? selected.inscripciones.length : 0;
        if (totalRows === 0) return;
        const nextExpanded = !isEventExpanded(selected, toggleRowsIndex);
        setEventExpanded(selected, toggleRowsIndex, nextExpanded);
        if (nextExpanded) {
          setVisibleRows(selected, toggleRowsIndex, DEFAULT_VISIBLE_ROWS);
        }
        renderEvents(currentEventos);
        return;
      }

      const showMoreButton = event.target.closest("[data-show-more]");
      if (showMoreButton) {
        const showMoreIndex = Number.parseInt(showMoreButton.getAttribute("data-show-more"), 10);
        if (!Number.isInteger(showMoreIndex)) return;
        const selected = currentEventos[showMoreIndex];
        if (!selected) return;
        const totalRows = Array.isArray(selected.inscripciones) ? selected.inscripciones.length : 0;
        setVisibleRows(selected, showMoreIndex, totalRows);
        renderEvents(currentEventos);
        return;
      }

      const showLessButton = event.target.closest("[data-show-less]");
      if (showLessButton) {
        const showLessIndex = Number.parseInt(showLessButton.getAttribute("data-show-less"), 10);
        if (!Number.isInteger(showLessIndex)) return;
        const selected = currentEventos[showLessIndex];
        if (!selected) return;
        setVisibleRows(selected, showLessIndex, DEFAULT_VISIBLE_ROWS);
        renderEvents(currentEventos);
        return;
      }

      const downloadButton = event.target.closest("[data-download-event]");
      if (downloadButton) {
        const index = Number.parseInt(downloadButton.getAttribute("data-download-event"), 10);
        if (!Number.isInteger(index)) return;

        const selected = currentEventos[index];
        if (!selected) return;

        downloadEventExcel(selected.evento || "evento", selected.inscripciones || []);
        return;
      }

      const resetRaffleButton = event.target.closest("[data-reset-raffle]");
      if (resetRaffleButton) {
        const resetIndex = Number.parseInt(resetRaffleButton.getAttribute("data-reset-raffle"), 10);
        if (!Number.isInteger(resetIndex) || raffleInFlight.has(resetIndex)) return;

        const selected = currentEventos[resetIndex];
        if (!selected) return;

        const dni = normalizeDniValue(resetRaffleButton.getAttribute("data-raffle-dni"));
        if (!dni) return;
        const resetDay = normalizeAttendanceDayKey(
          resetRaffleButton.getAttribute("data-raffle-day") ||
          getSelectedRaffleDay(selected, resetIndex)
        );

        if (isSanLuisEvent(selected) && !resetDay) {
          setStatusMessage("Selecciona el dia del sorteo antes de eliminar un ganador.", "error");
          return;
        }

        const participantName = resetRaffleButton.getAttribute("data-raffle-name") || "este ganador";
        const dayLabel = getDayLabel(resetDay);
        const confirmed = window.confirm(
          `Eliminar a ${participantName} del listado de ganadores${dayLabel ? ` del ${dayLabel}` : ""} y permitir que vuelva a participar?`
        );
        if (!confirmed) return;

        raffleInFlight.add(resetIndex);
        renderEvents(currentEventos);

        try {
          const result = await resetRaffleWinner(selected, dni, resetDay);
          if (result.redirected) return;

          updateRaffleStateLocally(selected, dni, false, "", result.dia || resetDay);
          const remainingLastWinners = getRaffleState(selected, resetIndex, result.dia || resetDay).filter(
            (winner) => normalizeDniValue(winner?.dni) !== dni
          );
          setRaffleState(selected, resetIndex, remainingLastWinners, result.dia || resetDay);

          setStatusMessage(
            `${participantName} fue eliminado de ganadores${dayLabel ? ` del ${dayLabel}` : ""} y ya puede volver a participar.`
          );
        } catch (error) {
          setStatusMessage(`Error: ${error.message}`, "error");
        } finally {
          raffleInFlight.delete(resetIndex);
          renderEvents(currentEventos);
        }
        return;
      }

      const drawRaffleButton = event.target.closest("[data-draw-raffle]");
      if (drawRaffleButton) {
        const drawIndex = Number.parseInt(drawRaffleButton.getAttribute("data-draw-raffle"), 10);
        if (!Number.isInteger(drawIndex) || raffleInFlight.has(drawIndex)) return;

        const selected = currentEventos[drawIndex];
        if (!selected) return;
        if (!isEventActive(selected)) {
          setStatusMessage("El encuentro esta inactivo. Activalo antes de hacer el sorteo.", "error");
          return;
        }
        const selectedDay = getSelectedRaffleDay(selected, drawIndex);
        const eligibleRows = getEligibleRaffleRows(selected, selectedDay);
        const drawCount = getRaffleDrawCount(selected, drawIndex, eligibleRows.length, selectedDay);
        const selectedBrand = getRaffleBrandState(selected, drawIndex, selectedDay);

        if (isSanLuisEvent(selected) && !selectedDay) {
          setStatusMessage("Selecciona viernes 7/8 o sabado 8/8 antes de hacer el sorteo.", "error");
          return;
        }

        if (!selectedBrand) {
          setStatusMessage("Selecciona una marca antes de hacer el sorteo.", "error");
          return;
        }

        raffleInFlight.add(drawIndex);
        renderEvents(currentEventos);

        try {
          const result = await drawRaffleWinner(selected, drawCount, selectedBrand, selectedDay);
          if (result.redirected) return;
          const resultDay = normalizeAttendanceDayKey(result.dia || selectedDay);

          const responseWinners = Array.isArray(result?.ganadores)
            ? result.ganadores
            : (result?.ganador ? [result.ganador] : []);

          const localWinners = responseWinners
            .map((winner) =>
              updateRaffleStateLocally(
                selected,
                winner?.dni,
                true,
                winner?.marca_sorteo || selectedBrand,
                resultDay
              ) || winner
            )
            .filter(Boolean);

          setRaffleState(selected, drawIndex, localWinners, resultDay);

          const winnerNames = localWinners
            .map((winner) => winner?.nombre_apellido || "Ganador sin nombre")
            .filter(Boolean);
          const namesPreview = winnerNames.slice(0, 3).join(", ");
          const extraCount = Math.max(winnerNames.length - 3, 0);
          const namesText = extraCount > 0
            ? `${namesPreview} y ${extraCount} mas`
            : namesPreview;
          const brandLabel = getBrandLabel(selectedBrand);

          openRaffleScreen({
            eventName: `${selected.evento}${getDayLabel(resultDay) ? ` - ${getDayLabel(resultDay)}` : ""}`,
            brandKey: selectedBrand,
            winners: localWinners
          });

          setStatusMessage(
            `Sorteo realizado en ${selected.evento}${getDayLabel(resultDay) ? ` - ${getDayLabel(resultDay)}` : ""} para ${brandLabel}: ${winnerNames.length} ganador${winnerNames.length === 1 ? "" : "es"}${namesText ? ` (${namesText})` : ""}.`
          );
        } catch (error) {
          setStatusMessage(`Error: ${error.message}`, "error");
        } finally {
          raffleInFlight.delete(drawIndex);
          renderEvents(currentEventos);
        }
        return;
      }

      const downloadSummaryButton = event.target.closest("[data-download-summary-event]");
      if (!downloadSummaryButton) return;

      const summaryIndex = Number.parseInt(
        downloadSummaryButton.getAttribute("data-download-summary-event"),
        10
      );
      if (!Number.isInteger(summaryIndex)) return;

      const selected = currentEventos[summaryIndex];
      if (!selected) return;

      downloadEventSummaryExcel(selected.evento || "evento", selected.inscripciones || []);
    });

    eventsContainer.addEventListener("change", async (event) => {
      const attendanceDaySelect = event.target.closest("[data-attendance-day-select]");
      if (attendanceDaySelect) {
        const attendanceIndex = Number.parseInt(
          attendanceDaySelect.getAttribute("data-attendance-day-select"),
          10
        );
        if (!Number.isInteger(attendanceIndex)) return;
        const selected = currentEventos[attendanceIndex];
        if (!selected) return;
        const dayKey = setSelectedAttendanceDay(selected, attendanceIndex, attendanceDaySelect.value);
        const state = getAttendanceLookup(selected, attendanceIndex);
        state.dayKey = dayKey;
        state.error = "";
        renderEvents(currentEventos);
        return;
      }

      const mailRecipientInput = event.target.closest("[data-mail-recipient]");
      if (mailRecipientInput) {
        const mailIndex = Number.parseInt(
          mailRecipientInput.getAttribute("data-mail-recipient"),
          10
        );
        if (!Number.isInteger(mailIndex)) return;
        const selected = currentEventos[mailIndex];
        if (!selected) return;
        toggleMailRecipient(
          selected,
          mailIndex,
          mailRecipientInput.value,
          mailRecipientInput.checked === true
        );
        renderEvents(currentEventos);
        return;
      }

      const raffleDaySelect = event.target.closest("[data-raffle-day-select]");
      if (raffleDaySelect) {
        const raffleIndex = Number.parseInt(
          raffleDaySelect.getAttribute("data-raffle-day-select"),
          10
        );
        if (!Number.isInteger(raffleIndex)) return;
        const selected = currentEventos[raffleIndex];
        if (!selected) return;
        setSelectedRaffleDay(selected, raffleIndex, raffleDaySelect.value);
        renderEvents(currentEventos);
        return;
      }

      const raffleBrandSelect = event.target.closest("[data-raffle-brand-select]");
      if (raffleBrandSelect) {
        const raffleIndex = Number.parseInt(
          raffleBrandSelect.getAttribute("data-raffle-brand-select"),
          10
        );
        if (!Number.isInteger(raffleIndex)) return;

        const selected = currentEventos[raffleIndex];
        if (!selected) return;

        setRaffleBrandState(
          selected,
          raffleIndex,
          raffleBrandSelect.value,
          getSelectedRaffleDay(selected, raffleIndex)
        );
        return;
      }

      const raffleCountInput = event.target.closest("[data-raffle-count-input]");
      if (raffleCountInput) {
        const raffleIndex = Number.parseInt(
          raffleCountInput.getAttribute("data-raffle-count-input"),
          10
        );
        if (!Number.isInteger(raffleIndex)) return;

        const selected = currentEventos[raffleIndex];
        if (!selected) return;

        const selectedDay = getSelectedRaffleDay(selected, raffleIndex);
        const eligibleRows = getEligibleRaffleRows(selected, selectedDay);
        const nextValue = setRaffleDrawCount(
          selected,
          raffleIndex,
          raffleCountInput.value,
          eligibleRows.length,
          selectedDay
        );
        raffleCountInput.value = String(nextValue);
        return;
      }

      const attendanceRowCheckbox = event.target.closest("[data-attendance-row-toggle]");
      if (!attendanceRowCheckbox) return;

      const rowIndex = Number.parseInt(
        attendanceRowCheckbox.getAttribute("data-attendance-row-toggle"),
        10
      );
      if (!Number.isInteger(rowIndex)) return;

      const selected = currentEventos[rowIndex];
      if (!selected) return;

      const dniValue = attendanceRowCheckbox.getAttribute("data-attendance-dni");
      const normalizedDni = normalizeDniValue(dniValue);
      if (!normalizedDni) return;

      try {
        attendanceRowCheckbox.disabled = true;
        const nextAsistio = Boolean(attendanceRowCheckbox.checked);
        const saveResult = await persistAttendanceState(selected, normalizedDni, nextAsistio);
        if (saveResult.redirected) return;
        updateAttendanceStateLocally(selected, normalizedDni, saveResult.asistio);
        setStatusMessage("Asistencia guardada correctamente.");
      } catch (error) {
        setStatusMessage(`Error: ${error.message}`, "error");
      } finally {
        renderEvents(currentEventos);
      }
    });

    viewInscripcionesBtn.addEventListener("click", () => {
      setPanelView(PANEL_VIEW_INSCRIPCIONES);
    });

    viewAsistenciaBtn.addEventListener("click", () => {
      setPanelView(PANEL_VIEW_ASISTENCIA);
    });

    viewLunchBtn.addEventListener("click", () => {
      setPanelView(PANEL_VIEW_ALMUERZO);
    });

    viewCertificadosBtn.addEventListener("click", () => {
      setPanelView(PANEL_VIEW_CERTIFICADOS);
    });

    viewSorteosBtn.addEventListener("click", () => {
      setPanelView(PANEL_VIEW_SORTEOS);
    });

    viewCrearEventoBtn.addEventListener("click", () => {
      setPanelView(PANEL_VIEW_CREAR_EVENTO);
    });

    raffleScreenClose.addEventListener("click", closeRaffleScreen);
    raffleScreenLogoExpand.addEventListener("click", (event) => {
      event.stopPropagation();
      openBrandLogoViewer();
    });
    raffleScreenBrandLogo.addEventListener("click", openBrandLogoViewer);
    raffleScreen.addEventListener("click", (event) => {
      if (event.target === raffleScreen) {
        closeRaffleScreen();
      }
    });
    brandLogoViewerClose.addEventListener("click", closeBrandLogoViewer);
    brandLogoViewer.addEventListener("click", (event) => {
      if (event.target === brandLogoViewer) {
        closeBrandLogoViewer();
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") {
        return;
      }
      if (brandLogoViewer.classList.contains("is-open")) {
        closeBrandLogoViewer();
        return;
      }
      if (raffleScreen.classList.contains("is-open")) {
        closeRaffleScreen();
      }
    });

    renderViewButtons();
    refreshBtn.addEventListener("click", loadData);
    loadData();
  </script>
</body>
</html>
